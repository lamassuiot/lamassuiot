codecov:
  notify:
    # Notifications (PR comment + statuses) are only sent when the "codecov-notify"
    # job of .github/workflows/ci-test.yaml runs, once every test job has uploaded.
    manual_trigger: true

coverage:
  status:
    project:
      default: off
      core:
        target: auto
        flags:
        - core
      sdk:
        target: auto
        flags:
        - sdk
      shared-subsystems:
        target: auto
        flags:
        - shared-subsystems
      shared-aws:
        target: auto
        flags:
        - shared-aws
      shared-http:
        target: auto
        flags:
        - shared-http
      crypto-aws:
        target: auto
        flags:
        - crypto-aws
      crypto-filesystem:
        target: auto
        flags:
        - crypto-filesystem
      crypto-vaultkv2:
        target: auto
        flags:
        - crypto-vaultkv2
      crypto-azure:
        target: auto
        flags:
        - crypto-azure
      crypto-pkcs11:
        target: auto
        flags:
        - crypto-pkcs11
      eventbus-amqp:
        target: auto
        flags:
        - eventbus-amqp
      eventbus-aws:
        target: auto
        flags:
        - eventbus-aws
      storage-postgres:
        target: auto
        flags:
        - storage-postgres
      connector-awsiot:
        target: auto
        flags:
        - connector-awsiot
      connector-authz:
        target: auto
        flags:
        - connector-authz
      monolithic:
        target: auto
        flags:
        - monolithic
      backend:
        target: auto
        flags:
        - backend-rest
        - backend-assemblers-ca
        - backend-assemblers-kms
        - backend-assemblers-va
        - backend-assemblers-device-manager
        - backend-assemblers-dms-manager
        - backend-assemblers-alerts
    patch: off

# Flag names must match the "tag"/"flags" values uploaded by .github/workflows/ci-test.yaml
flags:
  core:
    paths:
        - core/
    carryforward: true
  sdk:
    paths:
        - sdk/
    carryforward: true
  shared-subsystems:
    paths:
        - shared/subsystems/
    carryforward: true
  shared-aws:
    paths:
        - shared/aws/
    carryforward: true
  shared-http:
    paths:
        - shared/http/
    carryforward: true
  crypto-aws:
    paths:
        - engines/crypto/aws/
    carryforward: true
  crypto-filesystem:
    paths:
        - engines/crypto/filesystem/
    carryforward: true
  crypto-vaultkv2:
    paths:
        - engines/crypto/vaultkv2/
    carryforward: true
  crypto-azure:
    paths:
        - engines/crypto/azure/
    carryforward: true
  crypto-pkcs11:
    paths:
        - engines/crypto/pkcs11/
    carryforward: true
  eventbus-amqp:
    paths:
        - engines/eventbus/amqp/
    carryforward: true
  eventbus-aws:
    paths:
        - engines/eventbus/aws/
    carryforward: true
  storage-postgres:
    paths:
        - engines/storage/postgres/
    carryforward: true
  connector-awsiot:
    paths:
        - connectors/awsiot/
    carryforward: true
  connector-authz:
    paths:
        - connectors/authz/
    carryforward: true
  monolithic:
    paths:
        - monolithic/
    carryforward: true
  backend-rest:
    paths:
        - backend/
    carryforward: true
  backend-assemblers-ca:
    paths:
        - backend/
    carryforward: true
  backend-assemblers-kms:
    paths:
        - backend/
    carryforward: true
  backend-assemblers-va:
    paths:
        - backend/
    carryforward: true
  backend-assemblers-device-manager:
    paths:
        - backend/
    carryforward: true
  backend-assemblers-dms-manager:
    paths:
        - backend/
    carryforward: true
  backend-assemblers-alerts:
    paths:
        - backend/
    carryforward: true

ignore:
  - "**/*_mock.go"
  - "**/*_test.go"
  - "**/*_testset.go"
  - "**/test/*"
  - "**/test/**/*"
  - "**/subsystem/*"
  - "**/subsystem/**/*"
  - "**/docker/**/*"
  - "**/docker/*"
  - "**/dockerrunner/**/*"
  - "**/dockerrunner/*"
