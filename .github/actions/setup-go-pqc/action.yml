name: Setup Go PQC fork
description: >-
  Installs the Lamassu Go fork (ghcr.io/lamassuiot/golang-pqc) on the runner,
  in place of actions/setup-go. Stock Go lacks x509 composite ML-DSA support.
  The toolchain is copied out of the image so tests still run on the runner
  host (dockertest bind mounts and port mappings rely on it).

inputs:
  image:
    description: Go fork image to take the toolchain from.
    default: ghcr.io/lamassuiot/golang-pqc:latest
  save-cache:
    description: Save the Go module and build caches (only one job should do it).
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Go fork toolchain
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        goroot=$(docker run --rm "$IMAGE" go env GOROOT)
        id=$(docker create "$IMAGE")
        docker cp "$id:$goroot" "$RUNNER_TEMP/go-pqc"
        docker rm "$id" > /dev/null
        echo "$RUNNER_TEMP/go-pqc/bin" >> "$GITHUB_PATH"
        echo "GOROOT=$RUNNER_TEMP/go-pqc" >> "$GITHUB_ENV"
        # Never let go.mod's go directive swap the fork for a stock toolchain
        echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"

    - name: Check Go fork
      shell: bash
      run: |
        go version
        go doc crypto/x509.CompositeAlgorithms > /dev/null

    - name: Go cache key
      id: key
      shell: bash
      run: echo "key=go-pqc-${{ runner.os }}-$(go version | cut -d' ' -f3)-${{ hashFiles('go.sum') }}" >> "$GITHUB_OUTPUT"

    - name: Save Go caches
      if: inputs.save-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ steps.key.outputs.key }}

    - name: Restore Go caches
      if: inputs.save-cache != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ steps.key.outputs.key }}
