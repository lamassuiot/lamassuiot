name: GO Unit Testing

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    strategy:
      max-parallel: 5
      matrix:
        module:
          - path: core
            tag: core
          - path: sdk
            tag: sdk
          - path: shared/subsystems
            tag: shared-subsystems
          - path: shared/aws
            tag: shared-aws
          - path: shared/http
            tag: shared-http
          - path: engines/crypto/aws
            tag: crypto-aws
          - path: engines/crypto/filesystem
            tag: crypto-filesystem
          - path: engines/crypto/vaultkv2
            tag: crypto-vaultkv2
          - path: engines/eventbus/amqp
            tag: eventbus-amqp
          - path: engines/eventbus/aws
            tag: eventbus-aws
          - path: engines/storage/postgres
            tag: storage-postgres
          - path: connectors/awsiot
            tag: connector-awsiot
          - path: monolithic
            tag: monolithic

    name: ${{ matrix.module.path }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.26.2' # The Go version to download (if necessary) and use.
          cache-dependency-path: "**/*.sum"

      - name: Install Dependencies
        working-directory: ${{ matrix.module.path }}
        run: go work sync

      - name: Run Golang Tests with coverage
        id: run
        working-directory: ${{ matrix.module.path }}
        run: |
          go run gotest.tools/gotestsum@latest --format github-actions ./... -coverpkg=./... -timeout 300s -coverprofile coverage.txt -covermode=atomic

      #- name: Upload coverage reports to Codecov
        #uses: codecov/codecov-action@v7
        #with:
          #token: ${{ secrets.CODECOV_TOKEN }}
          #commit_parent: ${{ github.event.pull_request.base.sha }}
          #fail_ci_if_error: true
          #verbose: true
          #flags: ${{ matrix.module.tag }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.module.tag }}
          path: ${{ matrix.module.path }}/coverage.out
          if-no-files-found: error
          retention-days: 7
          
  test-pkcs11:
    name: engines/crypto/pkcs11
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.26.2' # The Go version to download (if necessary) and use.
          cache-dependency-path: "**/*.sum"

      - name: Install PKCS11 Proxy Dependencies
        run: |
          sudo apt-get install -y libseccomp-dev #Required for building pkcs11-proxy
          git clone https://github.com/SUNET/pkcs11-proxy
          cd pkcs11-proxy
          cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 .
          make
          sudo make install
          sudo cp pkcs11-daemon /usr/local/bin/
          ls /usr/local/lib/libpkcs11-proxy.so

      - name: Install Dependencies
        working-directory: engines/crypto/pkcs11
        run: go work sync

      - name: Run Golang Tests with coverage
        id: run
        working-directory: engines/crypto/pkcs11
        env:
          PKCS11_MODULE_PATH: /usr/local/lib/libpkcs11-proxy.so
        run: |
          go run gotest.tools/gotestsum@latest --format github-actions ./... -coverpkg=./... -timeout 1200s -coverprofile coverage.txt -covermode=atomic

      #- name: Upload coverage reports to Codecov
        #uses: codecov/codecov-action@v7
        #with:
          #token: ${{ secrets.CODECOV_TOKEN }}
          #commit_parent: ${{ github.event.pull_request.base.sha }}
          #fail_ci_if_error: true
          #verbose: true
          #flags: crypto-pkcs11

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-crypto-pkcs11
          path: engines/crypto/pkcs11/coverage.out
          if-no-files-found: error
          retention-days: 7
          
  test-backend-assemblers:
    strategy:
      max-parallel: 5
      matrix:
        module:
          - path: backend/pkg/assemblers/tests/ca
            tag: backend-assemblers-ca
            name: CA
          - path: backend/pkg/assemblers/tests/kms
            tag: backend-assemblers-kms
            name: KMS
          - path: backend/pkg/assemblers/tests/va
            tag: backend-assemblers-va
            name: VA
          - path: backend/pkg/assemblers/tests/device-manager
            tag: backend-assemblers-device-manager
            name: Device Manager
          - path: backend/pkg/assemblers/tests/dms-manager
            tag: backend-assemblers-dms-manager
            name: DMS Manager
          - path: backend/pkg/assemblers/tests/alerts
            tag: backend-assemblers-alerts
            name: Alerts
    name: ${{ matrix.module.name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.26.2'
          cache-dependency-path: "**/*.sum"

      - name: Install Dependencies
        working-directory: backend
        run: go work sync

      - name: Run Golang Tests with coverage
        id: run
        working-directory: ${{ matrix.module.path }}
        run: |
          go run gotest.tools/gotestsum@latest --format github-actions ./... -coverpkg=./... -timeout 900s -coverprofile coverage.txt -covermode=atomic

      #- name: Upload coverage reports to Codecov
        #uses: codecov/codecov-action@v7
        #with:
          #token: ${{ secrets.CODECOV_TOKEN }}
          #commit_parent: ${{ github.event.pull_request.base.sha }}
          #fail_ci_if_error: true
          #verbose: true
          #flags: ${{ matrix.module.tag }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.module.tag }}
          path: ${{ matrix.module.path }}/coverage.out
          if-no-files-found: error
          retention-days: 7
          
  test-backend-rest:
    name: backend (excluding assemblers/tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.26.2'
          cache-dependency-path: "**/*.sum"

      - name: Install Dependencies
        working-directory: backend
        run: go work sync

      - name: Run Golang Tests with coverage
        id: run
        working-directory: backend
        run: |
          go run gotest.tools/gotestsum@latest --format github-actions -- $(go list ./... | grep -v '/pkg/assemblers/tests') -coverpkg=./... -timeout 300s -coverprofile coverage.txt -covermode=atomic

      #- name: Upload coverage reports to Codecov
       # uses: codecov/codecov-action@v7
       # with:
          #token: ${{ secrets.CODECOV_TOKEN }}
          #commit_parent: ${{ github.event.pull_request.base.sha }}
          #fail_ci_if_error: true
          #verbose: true
          #flags: backend-rest

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend-rest
          path: backend/coverage.out
          if-no-files-found: error
          retention-days: 7
  sonarqube:
    name: SonarQube
    needs:
      - test
      - test-pkcs11
      - test-backend-assemblers
      - test-backend-rest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-reports
          merge-multiple: false
          
      - name: List downloaded coverage reports
        run: |
          echo "Coverage reports downloaded:"
          find coverage-reports -type f -name "coverage.out"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
