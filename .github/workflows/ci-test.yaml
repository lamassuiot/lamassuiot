name: GO Unit Testing

permissions: {}

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - v4
  workflow_dispatch:
  
jobs:
  setup:
    name: Set up tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Saves the Go module and build caches once, so every test job restores them instead of racing to create them
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '^1.27.3'
          cache-dependency-path: "**/*.sum"

      - name: Install Dependencies
        run: |
          go mod download
          go tool gotestsum --version

      # -exec /bin/true compiles the test binaries without running them (no TestMain, no containers)
      - name: Warm up build cache
        run: |
          go build ./...
          go test -exec /bin/true ./... > /dev/null

  test:
    needs: setup
    strategy:
      max-parallel: 5
      matrix:
        module: 
          - path: core
            tag: core
          - path: sdk
            tag: sdk
          - path: shared/subsystems 
            tag: shared-subsystems
          - path: shared/aws
            tag: shared-aws
          - path: shared/http
            tag: shared-http
          - path: engines/crypto/aws
            tag: crypto-aws
          - path: engines/crypto/filesystem
            tag: crypto-filesystem
          - path: engines/crypto/software
            tag: crypto-software
          - path: engines/crypto/vaultkv2
            tag: crypto-vaultkv2
          - path: engines/crypto/azure
            tag: crypto-azure
          - path: engines/fs-storage/localfs
            tag: fs-storage-localfs
          - path: engines/fs-storage/s3
            tag: fs-storage-s3
          - path: engines/eventbus/amqp
            tag: eventbus-amqp
          - path: engines/eventbus/aws
            tag: eventbus-aws
          - path: engines/storage/postgres
            tag: storage-postgres
          - path: connectors/awsiot
            tag: connector-awsiot
          - path: connectors/authz
            tag: connector-authz
          - path: monolithic
            tag: monolithic
          
    name: ${{ matrix.module.path }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
 
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '^1.27.3' # The Go version to download (if necessary) and use.
          cache-dependency-path: "**/*.sum"
 
      - name: Install Dependencies
        run: go mod download

      - name: Run Golang Tests with coverage
        id: run
        working-directory: ${{ matrix.module.path }}
        run: |
          go tool gotestsum --format github-actions ./... -coverpkg=./... -timeout 300s -coverprofile coverage.txt -covermode=atomic

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
          flags: ${{ matrix.module.tag }}
  test-pkcs11:
    needs: setup
    name: engines/crypto/pkcs11
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
 
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '^1.27.3' # The Go version to download (if necessary) and use.
          cache-dependency-path: "**/*.sum"
      
      - name: Install PKCS11 Proxy Dependencies
        # v3 maps CKA_LABEL to NetHSM labels (max 32 bytes); Lamassu uses 64-byte key digests.
        run: |
          wget https://github.com/Nitrokey/nethsm-pkcs11/releases/download/v2.2.0/nethsm-pkcs11-v2.2.0-x86_64-linux-glibc.so
          printf '%s  %s\n' '0d32cce121e9ff6d7616f4c95d58355b0a821d7d4af20451cea8efec96e77bd1' 'nethsm-pkcs11-v2.2.0-x86_64-linux-glibc.so' | sha256sum --check --strict -
      - name: Install Dependencies
        run: go mod download

      - name: Run Golang Tests with coverage
        id: run
        working-directory: engines/crypto/pkcs11
        env:
          PKCS11_MODULE_PATH: ${{ github.workspace }}/nethsm-pkcs11-v2.2.0-x86_64-linux-glibc.so
        run: |
          go tool gotestsum --format github-actions ./... -coverpkg=./... -timeout 1200s -coverprofile coverage.txt -covermode=atomic

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
          flags: crypto-pkcs11

  test-backend-assemblers:
    needs: setup
    strategy:
      max-parallel: 5
      matrix:
        module:
          - path: backend/pkg/assemblers/tests/ca
            tag: backend-assemblers-ca
            name: CA
          - path: backend/pkg/assemblers/tests/kms
            tag: backend-assemblers-kms
            name: KMS
          - path: backend/pkg/assemblers/tests/va
            tag: backend-assemblers-va
            name: VA
          - path: backend/pkg/assemblers/tests/device-manager
            tag: backend-assemblers-device-manager
            name: Device Manager
          - path: backend/pkg/assemblers/tests/dms-manager
            tag: backend-assemblers-dms-manager
            name: DMS Manager
          - path: backend/pkg/assemblers/tests/alerts
            tag: backend-assemblers-alerts
            name: Alerts
    name: ${{ matrix.module.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
 
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '^1.27.3'
          cache-dependency-path: "**/*.sum"
 
      - name: Install Dependencies
        run: go mod download

      - name: Run Golang Tests with coverage
        id: run
        working-directory: ${{ matrix.module.path }}
        run: |
          go tool gotestsum --format github-actions ./... -coverpkg=./... -timeout 900s -coverprofile coverage.txt -covermode=atomic

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
          flags: ${{ matrix.module.tag }}

  test-backend-rest:
    needs: setup
    name: backend (excluding assemblers/tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
 
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '^1.27.3'
          cache-dependency-path: "**/*.sum"
 
      - name: Install Dependencies
        run: go mod download

      - name: Run Golang Tests with coverage
        id: run
        working-directory: backend
        run: |
          go tool gotestsum --format github-actions -- $(go list ./... | grep -v '/pkg/assemblers/tests') -coverpkg=./... -timeout 300s -coverprofile coverage.txt -covermode=atomic

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
          flags: backend-rest

  test-oracle:
    name: Oracle storage tests
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      oracle:
        image: gvenzl/oracle-free:23.26.3-slim-faststart
        env:
          ORACLE_PASSWORD: LamassuTest123
          APP_USER: lamassu
          APP_USER_PASSWORD: LamassuTest123
        ports:
          - 1521:1521
        options: >-
          --health-cmd /opt/oracle/healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 60
          --health-start-period 60s
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_DB: pki
          POSTGRES_USER: lamassu
          POSTGRES_PASSWORD: LamassuTest123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lamassu -d pki"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '^1.27.3'
          cache-dependency-path: "**/*.sum"
      - name: Run Oracle storage tests without CGO
        env:
          CGO_ENABLED: 0
          LAMASSU_TEST_ORACLE_CONNECT_STRING: localhost:1521/FREEPDB1
          LAMASSU_TEST_ORACLE_USERNAME: lamassu
          LAMASSU_TEST_ORACLE_PASSWORD: LamassuTest123
          LAMASSU_TEST_POSTGRES_HOSTNAME: localhost
          LAMASSU_TEST_POSTGRES_USERNAME: lamassu
          LAMASSU_TEST_POSTGRES_PASSWORD: LamassuTest123
        run: go test -count=1 -timeout 10m ./engines/storage/oracle/... ./connectors/authz/pkg/api

  codecov-notify:
    name: Codecov notifications
    needs: [lint, test, test-pkcs11, test-backend-assemblers, test-backend-rest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Uploads are held by Codecov (codecov.notify.manual_trigger) until every test job has finished
      - name: Send Codecov notifications
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          run_command: send-notifications
          fail_ci_if_error: true
          verbose: true

  lint:
    name: Go lint
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '^1.27.3'
          cache-dependency-path: "**/*.sum"

      - name: Check formatting
        run: |
          files=$(gofmt -l \
            ./connectors/authz \
            ./engines/crypto \
            ./engines/fs-storage \
            ./backend/pkg/jobs)
          if [[ -n "$files" ]]; then
            echo "The following Go files are not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./connectors/authz/... ./engines/crypto/... ./engines/fs-storage/... ./backend/pkg/jobs
