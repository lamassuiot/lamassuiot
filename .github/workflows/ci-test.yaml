name: GO Unit Testing

permissions: {}

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - v4
  workflow_dispatch:
  
jobs:
  setup:
    name: Set up tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Saves the Go module and build caches once, so every test job restores them instead of racing to create them
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '^1.27.3'
          cache-dependency-path: "**/*.sum"

      - name: Install Dependencies
        run: |
          go mod download
          go tool gotestsum --version

      # -exec /bin/true compiles the test binaries without running them (no TestMain, no containers)
      - name: Warm up build cache
        run: |
          go build ./...
          go test -exec /bin/true ./... > /dev/null

  test:
    needs: setup
    strategy:
      max-parallel: 5
      matrix:
        module: 
          - path: core
            tag: core
          - path: sdk
            tag: sdk
          - path: shared/subsystems 
            tag: shared-subsystems
          - path: shared/aws
            tag: shared-aws
          - path: shared/http
            tag: shared-http
          - path: engines/crypto/aws
            tag: crypto-aws
          - path: engines/crypto/filesystem
            tag: crypto-filesystem
          - path: engines/crypto/software
            tag: crypto-software
          - path: engines/crypto/vaultkv2
            tag: crypto-vaultkv2
          - path: engines/crypto/azure
            tag: crypto-azure
          - path: engines/fs-storage/localfs
            tag: fs-storage-localfs
          - path: engines/fs-storage/s3
            tag: fs-storage-s3
          - path: engines/eventbus/amqp
            tag: eventbus-amqp
          - path: engines/eventbus/aws
            tag: eventbus-aws
          - path: engines/storage/postgres
            tag: storage-postgres
          - path: connectors/awsiot
            tag: connector-awsiot
          - path: connectors/authz
            tag: connector-authz
          - path: monolithic
            tag: monolithic
          
    name: ${{ matrix.module.path }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
 
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '^1.27.3' # The Go version to download (if necessary) and use.
          cache-dependency-path: "**/*.sum"
 
      - name: Install Dependencies
        run: go mod download

      - name: Run Golang Tests with coverage
        id: run
        working-directory: ${{ matrix.module.path }}
        run: |
          go tool gotestsum --format github-actions ./... -coverpkg=./... -timeout 300s -coverprofile coverage.txt -covermode=atomic

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
          flags: ${{ matrix.module.tag }}
  test-pkcs11:
    needs: setup
    name: engines/crypto/pkcs11
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
 
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '^1.27.3' # The Go version to download (if necessary) and use.
          cache-dependency-path: "**/*.sum"
      
      - name: Install PKCS11 Proxy Dependencies
        # v3 maps CKA_LABEL to NetHSM labels (max 32 bytes); Lamassu uses 64-byte key digests.
        run: |
          wget https://github.com/Nitrokey/nethsm-pkcs11/releases/download/v2.2.0/nethsm-pkcs11-v2.2.0-x86_64-linux-glibc.so
          printf '%s  %s\n' '0d32cce121e9ff6d7616f4c95d58355b0a821d7d4af20451cea8efec96e77bd1' 'nethsm-pkcs11-v2.2.0-x86_64-linux-glibc.so' | sha256sum --check --strict -
      - name: Install Dependencies
        run: go mod download

      - name: Run Golang Tests with coverage
        id: run
        working-directory: engines/crypto/pkcs11
        env:
          PKCS11_MODULE_PATH: ${{ github.workspace }}/nethsm-pkcs11-v2.2.0-x86_64-linux-glibc.so
        run: |
          go tool gotestsum --format github-actions ./... -coverpkg=./... -timeout 1200s -coverprofile coverage.txt -covermode=atomic

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
          flags: crypto-pkcs11

  test-backend-assemblers:
    needs: setup
    strategy:
      max-parallel: 5
      matrix:
        module:
          - path: backend/pkg/assemblers/tests/ca
            tag: backend-assemblers-ca
            name: CA
          - path: backend/pkg/assemblers/tests/kms
            tag: backend-assemblers-kms
            name: KMS
          - path: backend/pkg/assemblers/tests/va
            tag: backend-assemblers-va
            name: VA
          - path: backend/pkg/assemblers/tests/device-manager
            tag: backend-assemblers-device-manager
            name: Device Manager
          - path: backend/pkg/assemblers/tests/dms-manager
            tag: backend-assemblers-dms-manager
            name: DMS Manager
          - path: backend/pkg/assemblers/tests/alerts
            tag: backend-assemblers-alerts
            name: Alerts
    name: ${{ matrix.module.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
 
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '^1.27.3'
          cache-dependency-path: "**/*.sum"
 
      - name: Install Dependencies
        run: go mod download

      - name: Run Golang Tests with coverage
        id: run
        working-directory: ${{ matrix.module.path }}
        run: |
          go tool gotestsum --format github-actions ./... -coverpkg=./... -timeout 900s -coverprofile coverage.txt -covermode=atomic

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
          flags: ${{ matrix.module.tag }}

  test-backend-rest:
    needs: setup
    name: backend (excluding assemblers/tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
 
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '^1.27.3'
          cache-dependency-path: "**/*.sum"
 
      - name: Install Dependencies
        run: go mod download

      - name: Run Golang Tests with coverage
        id: run
        working-directory: backend
        run: |
          go tool gotestsum --format github-actions -- $(go list ./... | grep -v '/pkg/assemblers/tests') -coverpkg=./... -timeout 300s -coverprofile coverage.txt -covermode=atomic

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
          flags: backend-rest

  codecov-notify:
    name: Codecov notifications
    needs: [lint, test, test-pkcs11, test-backend-assemblers, test-backend-rest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Uploads are held by Codecov (codecov.notify.manual_trigger) until every test job has finished
      - name: Send Codecov notifications
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          run_command: send-notifications
          fail_ci_if_error: true
          verbose: true

  codecov-watchdog:
    name: Codecov result watchdog
    needs: [codecov-notify]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
      statuses: read
    env:
      CODECOV_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NOTIFY_RESULT: ${{ needs.codecov-notify.result }}
      POLL_SECONDS: 20
      MAX_ATTEMPTS: 30
    steps:
      # manual_trigger keeps Codecov statuses pending until codecov-notify completes.
      # Keep polling so a permanently stalled Codecov result fails this required check.
      - name: Wait for Codecov result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$NOTIFY_RESULT" != "success" ]]; then
            echo "Codecov notifications did not complete successfully: $NOTIFY_RESULT"
            exit 1
          fi

          api_headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28")
          checks_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${CODECOV_SHA}/check-runs?per_page=100"
          statuses_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${CODECOV_SHA}/status"

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            checks=$(curl --fail-with-body --silent --show-error "${api_headers[@]}" "$checks_url")
            statuses=$(curl --fail-with-body --silent --show-error "${api_headers[@]}" "$statuses_url")

            codecov_checks=$(jq '[.check_runs[] | select((.name | ascii_downcase | contains("codecov")))]' <<<"$checks")
            codecov_statuses=$(jq '[.statuses[] | select((.context | ascii_downcase | contains("codecov")))]' <<<"$statuses")
            check_count=$(jq 'length' <<<"$codecov_checks")
            status_count=$(jq 'length' <<<"$codecov_statuses")
            failed_checks=$(jq '[.[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required")] | length' <<<"$codecov_checks")
            failed_statuses=$(jq '[.[] | select(.state == "failure" or .state == "error")] | length' <<<"$codecov_statuses")
            pending_checks=$(jq '[.[] | select(.status != "completed" or .conclusion == null)] | length' <<<"$codecov_checks")
            pending_statuses=$(jq '[.[] | select(.state == "pending")] | length' <<<"$codecov_statuses")

            echo "Attempt $attempt/$MAX_ATTEMPTS: checks=$check_count statuses=$status_count pending_checks=$pending_checks pending_statuses=$pending_statuses"

            if (( failed_checks > 0 || failed_statuses > 0 )); then
              echo "Codecov reported a failure for $CODECOV_SHA"
              exit 1
            fi

            if (( (check_count > 0 || status_count > 0) && pending_checks == 0 && pending_statuses == 0 )); then
              echo "Codecov completed for $CODECOV_SHA"
              exit 0
            fi

            sleep "$POLL_SECONDS"
          done

          echo "Codecov did not complete within $((POLL_SECONDS * MAX_ATTEMPTS)) seconds"
          exit 1

  lint:
    name: Go lint
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '^1.27.3'
          cache-dependency-path: "**/*.sum"

      - name: Check formatting
        run: |
          files=$(gofmt -l \
            ./connectors/authz \
            ./engines/crypto \
            ./engines/fs-storage \
            ./backend/pkg/jobs)
          if [[ -n "$files" ]]; then
            echo "The following Go files are not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./connectors/authz/... ./engines/crypto/... ./engines/fs-storage/... ./backend/pkg/jobs
