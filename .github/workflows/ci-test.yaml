name: GO Unit Testing

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:
  
jobs:
  test:
    strategy:
      max-parallel: 5
      matrix:
        module: 
          - path: core
            tag: core
          - path: sdk
            tag: sdk
          - path: shared/subsystems 
            tag: shared-subsystems
          - path: shared/aws
            tag: shared-aws
          - path: shared/http
            tag: shared-http
          - path: engines/crypto/aws
            tag: crypto-aws
          - path: engines/crypto/filesystem
            tag: crypto-filesystem
          - path: engines/crypto/vaultkv2
            tag: crypto-vaultkv2
          - path: engines/eventbus/amqp
            tag: eventbus-amqp
          - path: engines/eventbus/aws
            tag: eventbus-aws
          - path: engines/storage/postgres
            tag: storage-postgres
          - path: connectors/awsiot
            tag: connector-awsiot
          - path: connectors/authz
            tag: connector-authz
          - path: monolithic
            tag: monolithic
          
    name: ${{ matrix.module.path }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
 
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '^1.26.2' # The Go version to download (if necessary) and use.
          cache-dependency-path: "**/*.sum"
 
      - name: Install Dependencies
        working-directory: ${{ matrix.module.path }}
        run: go work sync

      - name: Run Golang Tests with coverage
        id: run
        working-directory: ${{ matrix.module.path }}
        run: |
          go run gotest.tools/gotestsum@latest --format github-actions --junitfile junit.xml ./... -coverpkg=./... -timeout 300s -coverprofile coverage.txt -covermode=atomic

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.module.tag }}
          path: ${{ matrix.module.path }}/junit.xml
          if-no-files-found: warn

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          commit_parent: ${{ github.event.pull_request.base.sha }}
          fail_ci_if_error: true
          verbose: true
          flags: ${{ matrix.module.tag }}
  test-pkcs11:
    name: engines/crypto/pkcs11
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
 
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '^1.26.2' # The Go version to download (if necessary) and use.
          cache-dependency-path: "**/*.sum"
      
      - name: Install PKCS11 Proxy Dependencies
        run: |
          wget https://github.com/Nitrokey/nethsm-pkcs11/releases/download/v2.2.0/nethsm-pkcs11-v2.2.0-x86_64-linux-glibc.so

      - name: Install Dependencies
        working-directory: engines/crypto/pkcs11
        run: go work sync

      - name: Run Golang Tests with coverage
        id: run
        working-directory: engines/crypto/pkcs11
        env:
          PKCS11_MODULE_PATH: ${{ github.workspace }}/nethsm-pkcs11-v2.2.0-x86_64-linux-glibc.so
        run: |
          go run gotest.tools/gotestsum@latest --format github-actions --junitfile junit.xml ./... -coverpkg=./... -timeout 1200s -coverprofile coverage.txt -covermode=atomic

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-crypto-pkcs11
          path: engines/crypto/pkcs11/junit.xml
          if-no-files-found: warn

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          commit_parent: ${{ github.event.pull_request.base.sha }}
          fail_ci_if_error: true
          verbose: true
          flags: crypto-pkcs11

  test-backend-assemblers:
    strategy:
      max-parallel: 5
      matrix:
        module:
          - path: backend/pkg/assemblers/tests/ca
            tag: backend-assemblers-ca
            name: CA
          - path: backend/pkg/assemblers/tests/kms
            tag: backend-assemblers-kms
            name: KMS
          - path: backend/pkg/assemblers/tests/va
            tag: backend-assemblers-va
            name: VA
          - path: backend/pkg/assemblers/tests/device-manager
            tag: backend-assemblers-device-manager
            name: Device Manager
          - path: backend/pkg/assemblers/tests/dms-manager
            tag: backend-assemblers-dms-manager
            name: DMS Manager
          - path: backend/pkg/assemblers/tests/alerts
            tag: backend-assemblers-alerts
            name: Alerts
    name: ${{ matrix.module.name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
 
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '^1.26.2'
          cache-dependency-path: "**/*.sum"
 
      - name: Install Dependencies
        working-directory: backend
        run: go work sync

      - name: Run Golang Tests with coverage
        id: run
        working-directory: ${{ matrix.module.path }}
        run: |
          go run gotest.tools/gotestsum@latest --format github-actions --junitfile junit.xml ./... -coverpkg=./... -timeout 900s -coverprofile coverage.txt -covermode=atomic

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.module.tag }}
          path: ${{ matrix.module.path }}/junit.xml
          if-no-files-found: warn

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          commit_parent: ${{ github.event.pull_request.base.sha }}
          fail_ci_if_error: true
          verbose: true
          flags: ${{ matrix.module.tag }}

  test-backend-rest:
    name: backend (excluding assemblers/tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '^1.26.2'
          cache-dependency-path: "**/*.sum"

      - name: Install Dependencies
        working-directory: backend
        run: go work sync

      - name: Run Golang Tests with coverage
        id: run
        working-directory: backend
        run: |
          go run gotest.tools/gotestsum@latest --format github-actions --junitfile junit.xml -- $(go list ./... | grep -v '/pkg/assemblers/tests') -coverpkg=./... -timeout 300s -coverprofile coverage.txt -covermode=atomic

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-backend-rest
          path: backend/junit.xml
          if-no-files-found: warn

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          commit_parent: ${{ github.event.pull_request.base.sha }}
          fail_ci_if_error: true
          verbose: true
          flags: backend-rest

  e2e-cmp:
    name: CMP E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      # The CMP compliance suite lives in the Lamassu fork of
      # siemens/cmp-test-suite, which carries the compatibility changes and
      # config/lamassu.robot committed — no patching step. It MUST be checked
      # out before any `working-directory: cmp-test-suite` step can run.
      - name: Checkout CMP test suite
        uses: actions/checkout@v5
        with:
          repository: lamassuiot/cmp-test-suite
          ref: main
          path: cmp-test-suite

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.26.2'
          cache-dependency-path: "**/*.sum"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install monolithic Go dependencies
        working-directory: monolithic
        run: go work sync

      # run-cmp-test-suite.sh handles the full flow against a clean full stack
      # (Postgres + RabbitMQ + WFX via Docker): creates the venv, waits for
      # sample-cmp-dms to exist, runs the CMP bootstrap, then executes the
      # suite. --fresh-full
      # starts and tears down the dev server itself, so no separate start/wait
      # steps are needed. continue-on-error: the suite has known unsupported
      # cases; the uploaded report is the source of truth, not a green check.
      - name: Run CMP E2E test suite
        id: cmp
        continue-on-error: true
        env:
          SUITE_DIR: ${{ github.workspace }}/cmp-test-suite
        run: |
          bash scripts/run-cmp-test-suite.sh --fresh-full

      - name: Upload Robot Framework report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmp-e2e-report
          path: cmp-test-suite/reports/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-cmp-e2e
          # One JUnit/xUnit file per Robot suite (Basic, Cert Conf Tests, ...).
          # The report job below globs '*.xml', so this renders as one row
          # per suite in the summary instead of a single flattened report.
          path: cmp-test-suite/reports/junit/*.xml
          if-no-files-found: warn

  report:
    name: Test Report
    runs-on: ubuntu-latest
    # Runs after every test job regardless of pass/fail, so the summary table
    # always reflects the full run (including which suites/modules failed).
    needs: [test, test-pkcs11, test-backend-assemblers, test-backend-rest, e2e-cmp]
    if: always()
    permissions:
      contents: read
      actions: read   # required to fetch this run's test-results-* artifacts
      checks: write   # required to publish the check run with the results table
    steps:
      # dorny/test-reporter runs `git ls-files` to resolve annotation paths,
      # so a checkout must exist even though this job doesn't build anything.
      - name: Checkout Repository
        uses: actions/checkout@v5

      # Download every test-results-<something> artifact uploaded by the jobs
      # above into its own subfolder (test-results/<artifact-name>/*.xml), so
      # same-named files (e.g. every Go module's junit.xml) don't collide.
      - name: Download all test-result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: test-results

      # A single check consuming every downloaded file with one plain glob
      # (no artifact regex fan-out) renders as ONE table with one row per
      # file — the FluentValidation-style summary, not one collapsed section
      # per module.
      - name: Publish test results
        uses: dorny/test-reporter@v2
        with:
          name: Test Results
          path: 'test-results/**/*.xml'
          # gotestsum --junitfile and Robot --xunit both emit JUnit XML.
          reporter: java-junit
          # Don't fail this workflow when tests failed in CI — the table itself
          # is the signal; the individual test jobs already reflect pass/fail.
          fail-on-error: false
          # Compact table only (one row per result file with pass/fail/skip
          # counts) — no per-test listing. Keeps the CMP e2e report readable
          # (11 suite files) instead of dumping all ~250 individual tests.
          only-summary: true
          # Write the same table to this run's own Actions "Summary" page.
          use-actions-summary: true