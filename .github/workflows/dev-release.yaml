name: "DEV Release Workflow: (ONLY creates docker images with dev tag)"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag (leave blank to use 'dev'). Cannot be 'latest' or start with a number."
        required: false
        default: ""
      go:
        description: "Go version to use as builder."
        required: true
        type: choice
        options:
          - golang:1.26.2-bookworm
          - ghcr.io/lamassuiot/golang-pqc:latest
          - ghcr.io/lamassuiot/golang-pqc:go1.27
          - ghcr.io/lamassuiot/golang-pqc:go1.26
          - other
        default: golang:1.26.2-bookworm
      other:
        description: "Only used when go = 'other'. Must be Debian/Ubuntu-based and provide apt-get (required by the ci/kms.dockerfile arm64 build)."
        type: string
        default: ""
 
jobs:
  validate_tag:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate tag input
        run: |
          TAG="${{ github.event.inputs.tag }}"
          TAG="${TAG:-dev}"

          # Disallow reserved tag
          if [[ "${TAG,,}" == "latest" ]]; then
            echo "Error: tag 'latest' is not allowed." >&2
            exit 1
          fi

          # Docker tag allowlist + prevents newline/env injection
          if ! [[ "$TAG" =~ ^[A-Za-z_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Error: tag must match ^[A-Za-z_][A-Za-z0-9_.-]{0,127}$ (got '$TAG')." >&2
            exit 1
          fi

          printf 'TAG=%s\n' "$TAG" >> "$GITHUB_ENV"

  build_docker_image:
    needs: validate_tag
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          [
            kms,
            ca,
            devmanager,
            dmsmanager,
            va,
            alerts,
            aws-connector,
            authz,
            lamassu-db-migration,
            ca-to-kms-migration,
          ]
    name: ${{ matrix.service }} - Release docker images
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.ref_name }}

      - name: Resolve tag
        run: |
          INPUT_TAG="${{ github.event.inputs.tag }}"
          TAG="${INPUT_TAG:-dev}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "SHA1VER=${TAG}-$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Resolve builder
        run: |
          GO_INPUT="${{ github.event.inputs.go }}"
          if [[ "$GO_INPUT" == "other" ]]; then
            BUILDER="${{ github.event.inputs.other }}"
          else
            BUILDER="$GO_INPUT"
          fi
          echo "BUILDER=$BUILDER" >> $GITHUB_ENV

      - name: Validate custom builder
        # Only kms.dockerfile requires apt-get (CGO cross-toolchain install for
        # arm64); other services build with CGO_ENABLED=0 and don't need it.
        if: github.event.inputs.go == 'other' && matrix.service == 'kms'
        env:
          BUILDER: ${{ github.event.inputs.other }}
        run: |
          set -euo pipefail
          if [[ -z "$BUILDER" ]]; then
            echo "::error::A custom builder image is required when go=other"
            exit 1
          fi
          docker pull "$BUILDER"
          if ! docker run --rm --entrypoint /bin/sh "$BUILDER" -c \
            'test -f /etc/debian_version && command -v apt-get >/dev/null'; then
            echo "::error::Custom builders must be Debian/Ubuntu-based and provide apt-get"
            exit 1
          fi

      - name: Login to Github Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Enable ARM64 emulation for Dockerfiles that need to execute target-architecture
      # binaries during the build. Go services may cross-compile natively via BUILDPLATFORM.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build ${{ matrix.service }} DEV docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ci/${{ matrix.service }}.dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILDER=${{ env.BUILDER }}
            SHA1VER=${{ env.SHA1VER }}
            VERSION=${{ env.TAG }}
          tags: |
            ghcr.io/lamassuiot/lamassu-${{ matrix.service }}:${{ env.TAG }}
          push: true
          sbom: true
