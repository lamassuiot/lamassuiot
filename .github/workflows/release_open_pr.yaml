name: "Release Workflow - Open Pull Request with release notes"

permissions: {}

on:
  workflow_dispatch:
    inputs:
      release_version:
        type: string
        description: release version when building docker containers (example; 2.0.0)

run-name: >-
  ${{ format('Open PR for release {0}', github.event.inputs.release_version) }}

jobs:
  open_pr:
    name: "Open PR with release notes and changelog"
    runs-on: ubuntu-latest
    steps:
      - name: Create release bot token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: release-bot-token
        with:
          client-id: ${{ vars.LAMASSU_RELEASE_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.LAMASSU_RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Get release bot app user ID
        id: get-release-bot-user-id
        run: echo "release-bot-user-id=$(gh api "/users/${{ steps.release-bot-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.release-bot-token.outputs.token }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.release-bot-token.outputs.token }}
          persist-credentials: false
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.1
          args: --tag v${{ github.event.inputs.release_version }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.1
          args: --unreleased --tag v${{ github.event.inputs.release_version }}
        env:
          OUTPUT: RELEASE-NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Read generated files
        id: read-files
        run: |
          echo "release-notes<<EOF" >> $GITHUB_OUTPUT
          cat RELEASE-NOTES.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.release-bot-token.outputs.token }}
          committer: ${{ steps.release-bot-token.outputs.app-slug }}[bot] <${{ steps.get-release-bot-user-id.outputs.release-bot-user-id }}+${{ steps.release-bot-token.outputs.app-slug }}[bot]@users.noreply.github.com>
          author: ${{ steps.release-bot-token.outputs.app-slug }}[bot] <${{ steps.get-release-bot-user-id.outputs.release-bot-user-id }}+${{ steps.release-bot-token.outputs.app-slug }}[bot]@users.noreply.github.com>
          commit-message: "chore: release: prepare release ${{ github.event.inputs.release_version }}"
          branch: "release-${{ github.event.inputs.release_version }}"
          title: "chore: release: prepare release ${{ github.event.inputs.release_version }}"
          signoff: true
          sign-commits: true
          body: |
            # Release ${{ github.event.inputs.release_version }}

            ## Release Notes

            ${{ steps.read-files.outputs.release-notes }}
