logs:
  level: "debug"

server:
  log_level: "debug"
  health_check: false
  listen_address: "0.0.0.0"
  port: 8085
  protocol: "http" #http | https
  
  authentication:
    jwt:
      enabled: true
      audience: "lamassu"
      issuer_jwks:
        - issuer: "https://Keycloak.Example.com/realms/Lamassu"
          jwks_url: "https://Keycloak.Example.com/realms/Lamassu/protocol/openid-connect/certs"
      allowed_algorithms:
        - "RS256"
      jwks_cache_ttl: "5m"
  internal_listener:
    enabled: true
    port: 8443
    cert_file: /internal-tls/tls.crt
    key_file: /internal-tls/tls.key
    client_ca_file: /internal-tls/ca.crt
  tenant_rate_limit:
    enabled: true
    requests_per_second: 100
    burst: 200

openapi:
  enabled: true
publisher_event_bus:
  log_level: "debug"
  enabled: true
  provider: amqp
  protocol: amqp #amqp | amqps
  hostname: 
  port: 5672
  basic_auth:
    enabled: true
    username: ""
    password: ""
storage:
  log_level: "info"
  provider: "postgres" #couch_db | postgres | dynamo_db
  hostname: 
  port: 5432
  username: "lamassu_app"
  password: ""
kms_client:
  log_level: info
  hostname: "kms"
  protocol: https
  port: 8443
  auth_mode: mtls
  mtls_options:
    cert_file: /internal-tls/tls.crt
    key_file: /internal-tls/tls.key
  ca_cert_file: /internal-tls/ca.crt

certificate_monitoring_job:
  enabled: true
  frequency: "* * * * *"
  automatic_ca_rotation:
    enabled: false
    renewal_delta: "1d"

va_server_domains:

  - "dev.lamassu.io/api/va"
