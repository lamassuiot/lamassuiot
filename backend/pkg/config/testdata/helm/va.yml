logs:
  level: "info"

server:
  log_level: "debug"
  listen_address: "0.0.0.0"
  port: 8085
  protocol: "http" #http | https
  
  authentication:
    jwt:
      enabled: true
      audience: "lamassu"
      issuer_jwks_urls:
        "https://keycloak.example.com/realms/lamassu": "https://keycloak.example.com/realms/lamassu/protocol/openid-connect/certs"
      allowed_algorithms:
        - "RS256"
      jwks_cache_ttl: "5m"
  internal_listener:
    enabled: true
    port: 8443
    cert_file: /internal-tls/tls.crt
    key_file: /internal-tls/tls.key
    client_ca_file: /internal-tls/ca.crt
  tenant_rate_limit:
    enabled: true
    requests_per_second: 100
    burst: 200

openapi:
  enabled: true
filesystem_storage:
  id: "local-1"
  type: "local"
  storage_directory: "/data/crl"

crl_monitoring_job:
  enabled: true
  frequency: "0 * * * *"

va_domains:

  - "dev.lamassu.io/api/va"

subscriber_event_bus:
  log_level: "debug"
  enabled: true
  provider: amqp
  protocol: amqp #amqp | amqps
  hostname: 
  port: 5672
  basic_auth:
    enabled: true
    username: ""
    password: ""
subscriber_dlq_event_bus:
  log_level: "debug"
  enabled: true
  provider: amqp
  protocol: amqp #amqp | amqps
  hostname: 
  port: 5672
  exchange: lamassu-dlq
  basic_auth:
    enabled: true
    username: ""
    password: ""
publisher_event_bus:
  log_level: "debug"
  enabled: true
  provider: amqp
  protocol: amqp #amqp | amqps
  hostname: 
  port: 5672
  basic_auth:
    enabled: true
    username: ""
    password: ""
storage:
  log_level: "info"
  provider: "postgres" #couch_db | postgres | dynamo_db
  hostname: 
  port: 5432
  username: "lamassu_app"
  password: ""
kms_client:
  log_level: info
  hostname: "kms"
  protocol: https
  port: 8443
  auth_mode: mtls
  mtls_options:
    cert_file: /internal-tls/tls.crt
    key_file: /internal-tls/tls.key
  ca_cert_file: /internal-tls/ca.crt
ca_client:
  log_level: info
  hostname: "ca"
  protocol: https
  port: 8443
  auth_mode: mtls
  mtls_options:
    cert_file: /internal-tls/tls.crt
    key_file: /internal-tls/tls.key
  ca_cert_file: /internal-tls/ca.crt
