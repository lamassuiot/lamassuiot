openapi: 3.0.3
info:
  title: Lamassu KMS API v2
  version: 2.0.0
  description: |
    Key Management Service (KMS) v2 API for Lamassu IoT Platform.

    Manages the full lifecycle of cryptographic keys — classical (RSA, ECDSA, ECDH,
    EdDSA, AES, HMAC) and post-quantum (ML-KEM-768, ML-KEM-1024) — and performs
    cryptographic operations (sign/verify, encrypt/decrypt, MAC, key wrap, KEM
    encapsulation and key agreement) server-side against a provisioned key.

    ## Key concepts

    - **Algorithm IDs** are stable string identifiers such as `ECDSA_SHA_256` or
      `ML_KEM_768`. They encode both the family and the parameters, so no separate
      key-size field is needed.
    - **Operations** declare what a key may be used for at creation time. Requesting
      an operation not permitted by the algorithm is rejected with `400`.
    - **State machine**: `enabled ⇄ disabled → pendingDeletion → destroyed`.
      `DELETE /keys/{id}` triggers a soft-delete (202); the key stays accessible
      until the pending window elapses.
    - **Aliases** are stable names that point to a key UUID. `PUT /aliases/{name}`
      is an upsert — it creates or atomically retargets in one call.
    - **Transparent alias resolution**: `GET /keys/{id}` accepts both a UUID and
      an alias name.
  contact:
    name: Lamassu IoT
    url: https://github.com/lamassuiot/lamassuiot
  license:
    name: Mozilla Public License 2.0
    url: https://github.com/lamassuiot/lamassuiot?tab=MPL-2.0-1-ov-file#readme

servers:
  - url: /v2/kms
    description: KMS API v2

tags:
  - name: Keys
    description: Key lifecycle management
  - name: Crypto
    description: |
      Cryptographic operations performed server-side against a provisioned key.
      The key is resolved by UUID or alias. The operation is only permitted if
      the key's `operations` set and `KeySpec` support it; otherwise `400` is
      returned. All binary payloads are base64-encoded (standard encoding).
  - name: State
    description: Key state machine transitions
  - name: Backup
    description: Key backup and restore
  - name: Aliases
    description: Stable alias management
  - name: Utility
    description: RNG and other utilities

paths:

  # ---------------------------------------------------------------------------
  # Keys
  # ---------------------------------------------------------------------------

  /keys:
    get:
      tags: [Keys]
      summary: List keys
      operationId: listKeys
      parameters:
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Limit'
        - name: filter
          in: query
          description: Server-side filter expression (e.g. `state[eq]enabled`)
          schema:
            type: string
      responses:
        '200':
          description: Paginated key list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListKeysResponse'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Keys]
      summary: Create or import a key
      description: |
        When `key_material` is absent a new key is generated (`CreateKey`).
        When `key_material` is present (base64-encoded PKCS#8 DER or raw symmetric
        bytes) the material is imported (`ImportKey`).
      operationId: createOrImportKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKeyRequest'
            examples:
              generateECDSA:
                summary: Generate ECDSA P-256 signing key
                value:
                  algorithm: ECDSA_SHA_256
                  operations: [sign, verify]
                  policy_id: pol-default
                  tags:
                    device_id: sensor-42
              generateMLKEM:
                summary: Generate ML-KEM-768 (post-quantum)
                value:
                  algorithm: ML_KEM_768
                  operations: [encapsulate, decapsulate]
              importRSA:
                summary: Import existing RSA 2048 key
                value:
                  algorithm: RSASSA_PKCS1_V1_5_SHA_256
                  operations: [sign, verify]
                  key_material: MIIEvAIBADANBgkqhkiG9w0BAQEFAASC...
      responses:
        '201':
          description: Key created or imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /keys/{id}:
    parameters:
      - $ref: '#/components/parameters/KeyID'

    get:
      tags: [Keys]
      summary: Get key
      description: |
        Returns the key identified by `id`. Accepts either a UUID or an alias name —
        resolution is transparent.
      operationId: getKey
      responses:
        '200':
          description: Key metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyMetadata'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [Keys]
      summary: Update key metadata
      description: |
        Patches mutable metadata fields (`tags`, `policy_id`, `not_after`).
        Never triggers a state transition — use `PUT /keys/{id}/state` for that.
      operationId: updateKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKeyRequest'
            example:
              tags:
                env: prod
                audited: "true"
              not_after: "2027-01-01T00:00:00Z"
      responses:
        '200':
          description: Updated key metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Keys]
      summary: Schedule key deletion
      description: |
        Soft-deletes the key by transitioning it to `pendingDeletion`. The key
        remains accessible until the pending window elapses.

        Use `?pending_days=N` to override the default 7-day window.
        Use `PUT /keys/{id}/state` with `{"state":"disabled"}` to cancel.
      operationId: deleteKey
      parameters:
        - name: pending_days
          in: query
          description: Days before the key is permanently destroyed (default 7)
          schema:
            type: integer
            default: 7
            minimum: 1
      responses:
        '202':
          description: Deletion scheduled — key is now `pendingDeletion`
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  state:
                    type: string
                    example: pendingDeletion
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------------------
  # Cryptographic operations
  # ---------------------------------------------------------------------------

  /keys/{id}/sign:
    parameters:
      - $ref: '#/components/parameters/KeyID'
    post:
      tags: [Crypto]
      summary: Sign a digest
      description: |
        Produces a signature over a pre-computed message `digest` using the key's
        private material. The digest's hash must match the one implied by
        `algorithm` (e.g. SHA-256 for `RSASSA_PSS_SHA_256`). Requires a key that
        authorises the `sign` operation.
      operationId: sign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignRequest'
            example:
              algorithm: ECDSA_SHA_256
              digest: 47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU=
      responses:
        '200':
          description: Signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /keys/{id}/verify:
    parameters:
      - $ref: '#/components/parameters/KeyID'
    post:
      tags: [Crypto]
      summary: Verify a signature
      description: |
        Verifies `signature` against `digest`. A cryptographic mismatch is a
        successful `200` response with `valid: false` — not an error. Requires a
        key that authorises the `verify` operation.
      operationId: verify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /keys/{id}/encrypt:
    parameters:
      - $ref: '#/components/parameters/KeyID'
    post:
      tags: [Crypto]
      summary: Encrypt plaintext
      description: |
        Encrypts `plaintext`. Works for both asymmetric keys (RSAES-OAEP, where
        `associated_data` is the OAEP label) and symmetric AEAD keys
        (`SYMMETRIC_DEFAULT`, AES-GCM). For symmetric keys the server generates a
        random `nonce` when none is supplied and returns it alongside the
        ciphertext. Requires a key that authorises the `encrypt` operation.
      operationId: encrypt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncryptRequest'
            examples:
              rsaOaep:
                summary: RSA-OAEP (asymmetric)
                value:
                  algorithm: RSAES_OAEP_SHA_256
                  plaintext: c2VjcmV0IHBheWxvYWQ=
              aesGcm:
                summary: AES-GCM (symmetric)
                value:
                  algorithm: SYMMETRIC_DEFAULT
                  plaintext: c2VjcmV0IHBheWxvYWQ=
                  associated_data: aGVhZGVy
      responses:
        '200':
          description: Ciphertext
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncryptResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /keys/{id}/decrypt:
    parameters:
      - $ref: '#/components/parameters/KeyID'
    post:
      tags: [Crypto]
      summary: Decrypt ciphertext
      description: |
        Decrypts `ciphertext` using the key's private material. For symmetric AEAD
        keys, `nonce` (and any `associated_data`) must match the values used at
        encrypt time. For RSA-OAEP, `associated_data` is the OAEP label. Requires
        a key that authorises the `decrypt` operation.
      operationId: decrypt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecryptRequest'
      responses:
        '200':
          description: Plaintext
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecryptResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /keys/{id}/mac:
    parameters:
      - $ref: '#/components/parameters/KeyID'
    post:
      tags: [Crypto]
      summary: Compute a MAC
      description: |
        Computes a message authentication code over `message` using an HMAC key.
        Requires a key that authorises the `mac` operation.
      operationId: mac
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MACRequest'
            example:
              algorithm: HMAC_SHA_256
              message: aGVsbG8gd29ybGQ=
      responses:
        '200':
          description: MAC
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MACResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /keys/{id}/verify-mac:
    parameters:
      - $ref: '#/components/parameters/KeyID'
    post:
      tags: [Crypto]
      summary: Verify a MAC
      description: |
        Verifies `mac` against `message`. A mismatch is a successful `200`
        response with `valid: false`. Requires a key that authorises the
        `verifyMac` operation.
      operationId: verifyMac
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyMACRequest'
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyMACResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /keys/{id}/wrap:
    parameters:
      - $ref: '#/components/parameters/KeyID'
    post:
      tags: [Crypto]
      summary: Wrap key material
      description: |
        Encrypts (wraps) externally supplied `key_material` under this key,
        typically for secure key transport. Requires a key that authorises the
        `wrapKey` operation.
      operationId: wrapKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WrapKeyRequest'
            example:
              algorithm: RSAES_OAEP_SHA_256
              key_material: AAECAwQFBgcICQoLDA0ODw==
      responses:
        '200':
          description: Wrapped key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WrapKeyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /keys/{id}/unwrap:
    parameters:
      - $ref: '#/components/parameters/KeyID'
    post:
      tags: [Crypto]
      summary: Unwrap key material
      description: |
        Decrypts (unwraps) a previously wrapped blob, returning the raw key
        material. Requires a key that authorises the `unwrapKey` operation.
      operationId: unwrapKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnwrapKeyRequest'
      responses:
        '200':
          description: Unwrapped key material
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnwrapKeyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /keys/{id}/encapsulate:
    parameters:
      - $ref: '#/components/parameters/KeyID'
    post:
      tags: [Crypto]
      summary: KEM encapsulate
      description: |
        Post-quantum KEM encapsulation (ML-KEM). Uses the key's public
        encapsulation key to generate a fresh shared secret and the ciphertext
        the holder of the private key needs to recover it. Takes no request body.
        Requires a key that authorises the `encapsulate` operation.
      operationId: encapsulate
      responses:
        '200':
          description: Shared secret and encapsulation ciphertext
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncapsulateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /keys/{id}/decapsulate:
    parameters:
      - $ref: '#/components/parameters/KeyID'
    post:
      tags: [Crypto]
      summary: KEM decapsulate
      description: |
        Post-quantum KEM decapsulation (ML-KEM). Recovers the shared secret from
        an encapsulation `ciphertext` using the key's private material. Requires a
        key that authorises the `decapsulate` operation.
      operationId: decapsulate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecapsulateRequest'
      responses:
        '200':
          description: Recovered shared secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecapsulateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /keys/{id}/agree:
    parameters:
      - $ref: '#/components/parameters/KeyID'
    post:
      tags: [Crypto]
      summary: Key agreement (ECDH)
      description: |
        Derives a shared secret from this key's private material and a peer's
        public key via ECDH. When `derive` is true the raw secret is further run
        through the supplied KDF and the derived key is returned instead. Requires
        a key that authorises the `agreeKey` (and `deriveKey`) operation.
      operationId: agree
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgreeRequest'
            example:
              algorithm: ECDH
              peer_public_key: "-----BEGIN PUBLIC KEY-----\nMFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE...\n-----END PUBLIC KEY-----\n"
      responses:
        '200':
          description: Shared (or derived) secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgreeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------------------
  # State
  # ---------------------------------------------------------------------------

  /keys/{id}/state:
    parameters:
      - $ref: '#/components/parameters/KeyID'

    put:
      tags: [State]
      summary: Set key state
      description: |
        Drives the key state machine. Valid transitions:

        | From             | To               | Notes                                       |
        |------------------|------------------|---------------------------------------------|
        | `enabled`        | `disabled`       | `DisableKey`                                |
        | `disabled`       | `enabled`        | `EnableKey`                                 |
        | `enabled`        | `pendingDeletion` | `ScheduleDeletion` — `deletion_scheduled_at` required |
        | `disabled`       | `pendingDeletion` | `ScheduleDeletion` — `deletion_scheduled_at` required |
        | `pendingDeletion` | `disabled`      | `CancelDeletion`                            |

        Invalid transitions return `409 Conflict`.
      operationId: setKeyState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetKeyStateRequest'
            examples:
              disable:
                summary: Disable key
                value:
                  state: disabled
              enable:
                summary: Re-enable key
                value:
                  state: enabled
              scheduleDeletion:
                summary: Schedule deletion
                value:
                  state: pendingDeletion
                  deletion_scheduled_at: "2026-07-15T00:00:00Z"
              cancelDeletion:
                summary: Cancel pending deletion (back to disabled)
                value:
                  state: disabled
      responses:
        '200':
          description: State transition applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateTransitionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflict — invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------------------
  # Backup
  # ---------------------------------------------------------------------------

  /keys/{id}/backup:
    parameters:
      - $ref: '#/components/parameters/KeyID'

    put:
      tags: [Backup]
      summary: Backup key
      description: |
        Exports an encrypted backup blob for the key. Only available for backends
        with `extractable: true`. Idempotent — repeated calls refresh the blob.
      operationId: backupKey
      responses:
        '200':
          description: Backup blob
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupKeyResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /keys/restore:
    post:
      tags: [Backup]
      summary: Restore key from backup
      description: |
        Imports a key from a previously exported backup blob. The restored key
        receives a new UUID; its metadata and algorithm are preserved from the blob.
      operationId: restoreKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreKeyRequest'
      responses:
        '200':
          description: Restored key metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------------------
  # Aliases
  # ---------------------------------------------------------------------------

  /aliases/{name}:
    parameters:
      - $ref: '#/components/parameters/AliasName'

    get:
      tags: [Aliases]
      summary: Resolve alias
      description: Returns the full key metadata for the key the alias points to.
      operationId: resolveAlias
      responses:
        '200':
          description: Key metadata for the aliased key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyMetadata'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Aliases]
      summary: Create or retarget alias
      description: |
        Upserts an alias. If the alias does not exist it is created; if it already
        exists it is atomically retargeted to the new key. Use this for key rotation
        without a delete-then-recreate race window.
      operationId: upsertAlias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertAliasRequest'
            example:
              key_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      responses:
        '200':
          description: Alias created or retargeted
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: ca-root-active
                  key_id:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Target key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Aliases]
      summary: Delete alias
      description: Removes the alias. The key itself is not affected.
      operationId: deleteAlias
      responses:
        '204':
          description: Alias deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------------------
  # Utility
  # ---------------------------------------------------------------------------

  /random:
    post:
      tags: [Utility]
      summary: Generate random bytes
      description: Returns cryptographically strong random bytes from the server's entropy source.
      operationId: generateRandom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRandomRequest'
            example:
              bytes: 32
      responses:
        '200':
          description: Random bytes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateRandomResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

# ---------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------

components:

  parameters:

    KeyID:
      name: id
      in: path
      required: true
      description: Key UUID or alias name
      schema:
        type: string
      example: 3fa85f64-5717-4562-b3fc-2c963f66afa6

    AliasName:
      name: name
      in: path
      required: true
      description: |
        Alias name. Restricted to `[a-zA-Z0-9_-]` characters; maximum 128 characters.
      schema:
        type: string
        pattern: '^[a-zA-Z0-9_-]{1,128}$'
      example: ca-root-active

    PageToken:
      name: page_token
      in: query
      description: Opaque token from a previous response's `next_page_token` field
      schema:
        type: string

    Limit:
      name: limit
      in: query
      description: Maximum number of items to return (default 50)
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 1000

  responses:

    BadRequest:
      description: Bad request — invalid input or operation not permitted by algorithm
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Key or alias not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    # -------------------------------------------------------------------------
    # Core domain types
    # -------------------------------------------------------------------------

    AlgorithmID:
      type: string
      description: |
        Stable algorithm identifier. Encodes both family and parameters.

        **RSA signing**
        - `RSASSA_PKCS1_V1_5_SHA_256` / `_SHA_384` / `_SHA_512` — PKCS#1 v1.5 (2048/3072/4096-bit key)
        - `RSASSA_PSS_SHA_256` / `_SHA_384` / `_SHA_512` — PSS (preferred for new code)

        **RSA encryption / key wrap**
        - `RSAES_OAEP_SHA_1_{2048,3072,4096}` — OAEP with SHA-1 label
        - `RSAES_OAEP_SHA_256_{2048,3072,4096}` — OAEP with SHA-256 label
        - `RSAES_OAEP_SHA_384_{2048,3072,4096}` — OAEP with SHA-384 label
        - `RSAES_OAEP_SHA_512_{2048,3072,4096}` — OAEP with SHA-512 label
        - `RSAES_PKCS1_V1_5_{2048,3072,4096}` — PKCS#1 v1.5 **legacy decrypt only**; never use for new encryption

        **ECDSA**
        - `ECDSA_SHA_256` — P-256 + SHA-256
        - `ECDSA_SHA_384` — P-384 + SHA-384
        - `ECDSA_SHA_512` — P-521 + SHA-512

        **EdDSA**
        - `ED25519`

        **ECDH key agreement**
        - `ECDH_NIST_P256` / `ECDH_NIST_P384` / `ECDH_NIST_P521` / `ECDH_X25519`

        **Symmetric AEAD**
        - `AES_GCM_128` / `AES_GCM_192` / `AES_GCM_256`
        - `AES_CBC_128` / `AES_CBC_192` / `AES_CBC_256` — **legacy decrypt only**

        **HMAC**
        - `HMAC_SHA_256` / `HMAC_SHA_384` / `HMAC_SHA_512`

        **Post-quantum KEM (FIPS 203 — ML-KEM)**
        - `ML_KEM_512` — security level 1
        - `ML_KEM_768` — security level 3 (recommended)
        - `ML_KEM_1024` — security level 5
      example: ECDSA_SHA_256

    KeyState:
      type: string
      enum: [enabled, disabled, pendingDeletion, destroyed]
      description: |
        Lifecycle state of the key.
        - `enabled` — key is active and usable
        - `disabled` — key is suspended; no operations permitted
        - `pendingDeletion` — scheduled for permanent destruction
        - `destroyed` — key material permanently erased; metadata retained for audit

    KeyOrigin:
      type: string
      enum: [generated, imported, external]
      description: How the key material was provisioned

    Operation:
      type: string
      enum:
        - sign
        - verify
        - encrypt
        - decrypt
        - wrapKey
        - unwrapKey
        - encapsulate
        - decapsulate
        - mac
        - verifyMac
        - agreeKey
        - deriveKey
      description: Cryptographic operation the key is authorised to perform

    KeyMetadata:
      type: object
      description: Complete metadata for a managed key
      properties:
        id:
          type: string
          format: uuid
          description: Stable unique identifier assigned at creation
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        algorithm:
          $ref: '#/components/schemas/AlgorithmID'
        operations:
          type: array
          items:
            $ref: '#/components/schemas/Operation'
          description: Operations this key is authorised to perform
          example: [sign, verify]
        state:
          $ref: '#/components/schemas/KeyState'
        public_key:
          type: string
          description: |
            Public key in PEM format (PKIX `BEGIN PUBLIC KEY` block) for
            asymmetric algorithms. Base64-encoded raw bytes for post-quantum
            types not yet covered by PKIX. Absent for symmetric keys.
          example: "-----BEGIN PUBLIC KEY-----\nMFkwEwYHKoZIzj0CAQY...\n-----END PUBLIC KEY-----\n"
        created_at:
          type: string
          format: date-time
          example: "2026-06-15T10:00:00Z"
        not_before:
          type: string
          format: date-time
          nullable: true
          example: "2026-06-15T00:00:00Z"
        not_after:
          type: string
          format: date-time
          nullable: true
          example: "2027-06-15T00:00:00Z"
        origin:
          $ref: '#/components/schemas/KeyOrigin'
        tags:
          type: object
          additionalProperties:
            type: string
          description: Arbitrary string key-value pairs for classification
          example:
            device_id: sensor-42
            env: prod
        policy_id:
          type: string
          description: Reference to an access/usage policy
          example: pol-default

    # -------------------------------------------------------------------------
    # Request bodies
    # -------------------------------------------------------------------------

    CreateKeyRequest:
      type: object
      required: [algorithm]
      properties:
        algorithm:
          $ref: '#/components/schemas/AlgorithmID'
        operations:
          type: array
          items:
            $ref: '#/components/schemas/Operation'
          description: |
            Subset of operations to permit. Defaults to the algorithm's full
            operation set when omitted. Must not include operations not permitted
            by the algorithm.
        tags:
          type: object
          additionalProperties:
            type: string
        policy_id:
          type: string
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        backend_hint:
          type: string
          description: Preferred backend name (e.g. `pkcs11-hsm-01`). Server falls back to policy routing when absent.
        key_material:
          type: string
          format: byte
          description: |
            Base64-encoded private key material for the **import** path.
            Asymmetric: PKCS#8 DER. Symmetric / ML-KEM: raw bytes.
            When present the request is treated as ImportKey; when absent a new
            key is generated.

    UpdateKeyRequest:
      type: object
      description: |
        Partial update of mutable metadata. Only fields that are explicitly
        provided are changed. State is never changed via this endpoint.
      properties:
        tags:
          type: object
          additionalProperties:
            type: string
        policy_id:
          type: string
        not_after:
          type: string
          format: date-time

    SetKeyStateRequest:
      type: object
      required: [state]
      properties:
        state:
          $ref: '#/components/schemas/KeyState'
        deletion_scheduled_at:
          type: string
          format: date-time
          description: Required when `state` is `pendingDeletion`. Must be in the future.
          example: "2026-07-15T00:00:00Z"

    RestoreKeyRequest:
      type: object
      required: [backup_blob]
      properties:
        backup_blob:
          type: string
          format: byte
          description: Base64-encoded blob previously returned by `PUT /keys/{id}/backup`

    UpsertAliasRequest:
      type: object
      required: [key_id]
      properties:
        key_id:
          type: string
          format: uuid
          description: UUID of the key this alias should point to
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6

    GenerateRandomRequest:
      type: object
      required: [bytes]
      properties:
        bytes:
          type: integer
          minimum: 1
          maximum: 1024
          description: Number of random bytes to generate
          example: 32

    # -------------------------------------------------------------------------
    # Cryptographic operation bodies
    # -------------------------------------------------------------------------

    SignRequest:
      type: object
      required: [algorithm, digest]
      properties:
        algorithm:
          $ref: '#/components/schemas/AlgorithmID'
        digest:
          type: string
          format: byte
          description: Base64-encoded, pre-hashed message digest

    SignResponse:
      type: object
      properties:
        id:
          type: string
          description: Key UUID that produced the signature
        algorithm:
          $ref: '#/components/schemas/AlgorithmID'
        signature:
          type: string
          format: byte
          description: Base64-encoded signature

    VerifyRequest:
      type: object
      required: [algorithm, digest, signature]
      properties:
        algorithm:
          $ref: '#/components/schemas/AlgorithmID'
        digest:
          type: string
          format: byte
          description: Base64-encoded, pre-hashed message digest
        signature:
          type: string
          format: byte
          description: Base64-encoded signature to verify

    VerifyResponse:
      type: object
      properties:
        id:
          type: string
        valid:
          type: boolean
          description: Whether the signature verified successfully

    EncryptRequest:
      type: object
      required: [algorithm, plaintext]
      properties:
        algorithm:
          $ref: '#/components/schemas/AlgorithmID'
        plaintext:
          type: string
          format: byte
          description: Base64-encoded plaintext
        nonce:
          type: string
          format: byte
          description: Base64-encoded nonce (symmetric AEAD only; generated when omitted)
        associated_data:
          type: string
          format: byte
          description: Base64-encoded associated data (symmetric AEAD) or OAEP label (RSA-OAEP)

    EncryptResponse:
      type: object
      properties:
        id:
          type: string
        algorithm:
          $ref: '#/components/schemas/AlgorithmID'
        ciphertext:
          type: string
          format: byte
          description: Base64-encoded ciphertext
        nonce:
          type: string
          format: byte
          description: Base64-encoded nonce (symmetric AEAD only)

    DecryptRequest:
      type: object
      required: [algorithm, ciphertext]
      properties:
        algorithm:
          $ref: '#/components/schemas/AlgorithmID'
        ciphertext:
          type: string
          format: byte
          description: Base64-encoded ciphertext
        nonce:
          type: string
          format: byte
          description: Base64-encoded nonce (symmetric AEAD only; must match encrypt)
        associated_data:
          type: string
          format: byte
          description: Base64-encoded associated data (symmetric AEAD) or OAEP label (RSA-OAEP)

    DecryptResponse:
      type: object
      properties:
        id:
          type: string
        plaintext:
          type: string
          format: byte
          description: Base64-encoded plaintext

    MACRequest:
      type: object
      required: [algorithm, message]
      properties:
        algorithm:
          $ref: '#/components/schemas/AlgorithmID'
        message:
          type: string
          format: byte
          description: Base64-encoded message

    MACResponse:
      type: object
      properties:
        id:
          type: string
        algorithm:
          $ref: '#/components/schemas/AlgorithmID'
        mac:
          type: string
          format: byte
          description: Base64-encoded MAC

    VerifyMACRequest:
      type: object
      required: [algorithm, message, mac]
      properties:
        algorithm:
          $ref: '#/components/schemas/AlgorithmID'
        message:
          type: string
          format: byte
          description: Base64-encoded message
        mac:
          type: string
          format: byte
          description: Base64-encoded MAC to verify

    VerifyMACResponse:
      type: object
      properties:
        id:
          type: string
        valid:
          type: boolean
          description: Whether the MAC verified successfully

    WrapKeyRequest:
      type: object
      required: [algorithm, key_material]
      properties:
        algorithm:
          $ref: '#/components/schemas/AlgorithmID'
        key_material:
          type: string
          format: byte
          description: Base64-encoded key material to wrap
        associated_data:
          type: string
          format: byte
          description: Base64-encoded associated data / OAEP label

    WrapKeyResponse:
      type: object
      properties:
        id:
          type: string
        algorithm:
          $ref: '#/components/schemas/AlgorithmID'
        wrapped_key:
          type: string
          format: byte
          description: Base64-encoded wrapped key material

    UnwrapKeyRequest:
      type: object
      required: [algorithm, wrapped_key]
      properties:
        algorithm:
          $ref: '#/components/schemas/AlgorithmID'
        wrapped_key:
          type: string
          format: byte
          description: Base64-encoded wrapped key material
        associated_data:
          type: string
          format: byte
          description: Base64-encoded associated data / OAEP label

    UnwrapKeyResponse:
      type: object
      properties:
        id:
          type: string
        key_material:
          type: string
          format: byte
          description: Base64-encoded unwrapped key material

    EncapsulateResponse:
      type: object
      properties:
        id:
          type: string
        shared_secret:
          type: string
          format: byte
          description: Base64-encoded shared secret generated by encapsulation
        ciphertext:
          type: string
          format: byte
          description: Base64-encoded encapsulation ciphertext for the private-key holder

    DecapsulateRequest:
      type: object
      required: [ciphertext]
      properties:
        ciphertext:
          type: string
          format: byte
          description: Base64-encoded encapsulation ciphertext

    DecapsulateResponse:
      type: object
      properties:
        id:
          type: string
        shared_secret:
          type: string
          format: byte
          description: Base64-encoded recovered shared secret

    AgreeRequest:
      type: object
      required: [algorithm, peer_public_key]
      properties:
        algorithm:
          $ref: '#/components/schemas/AlgorithmID'
        peer_public_key:
          type: string
          description: PEM-encoded PKIX public key of the peer
        derive:
          type: boolean
          description: When true, run the raw shared secret through the KDF below
        kdf_algorithm:
          $ref: '#/components/schemas/AlgorithmID'
        kdf_salt:
          type: string
          format: byte
          description: Base64-encoded KDF salt (used when `derive` is true)
        kdf_info:
          type: string
          format: byte
          description: Base64-encoded KDF context/info (used when `derive` is true)
        kdf_length:
          type: integer
          description: Desired derived-key length in bytes (used when `derive` is true)

    AgreeResponse:
      type: object
      properties:
        id:
          type: string
        shared_secret:
          type: string
          format: byte
          description: Base64-encoded shared secret (or derived key when `derive` was true)

    # -------------------------------------------------------------------------
    # Response bodies
    # -------------------------------------------------------------------------

    ListKeysResponse:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/KeyMetadata'
        next_page_token:
          type: string
          description: Opaque token to pass as `page_token` in the next request. Absent when no further pages exist.

    StateTransitionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/KeyState'
        previous_state:
          $ref: '#/components/schemas/KeyState'
        transitioned_at:
          type: string
          format: date-time
      example:
        id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        state: disabled
        previous_state: enabled
        transitioned_at: "2026-06-15T10:10:00Z"

    BackupKeyResponse:
      type: object
      properties:
        key_id:
          type: string
          format: uuid
        backup_blob:
          type: string
          format: byte
          description: Base64-encoded encrypted backup blob

    GenerateRandomResponse:
      type: object
      properties:
        bytes:
          type: integer
          description: Number of bytes generated
          example: 32
        data:
          type: string
          format: byte
          description: Base64-encoded random bytes
          example: "aGVsbG8gd29ybGQgdGhpcyBpcyBhIHRlc3Q="

    Error:
      type: object
      properties:
        err:
          type: string
          description: Human-readable error message
          example: key not found

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []
