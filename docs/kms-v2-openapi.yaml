openapi: 3.0.3
info:
  title: Lamassu KMS API v2
  version: 2.0.0
  description: |
    Key Management Service (KMS) v2 API for Lamassu IoT Platform.

    Manages the full lifecycle of cryptographic keys — classical (RSA, ECDSA, ECDH,
    EdDSA, AES, HMAC) and post-quantum (ML-KEM). This API covers key management only;
    cryptographic operations (sign, encrypt, MAC, …) are performed server-side once a
    key is provisioned, with the per-operation algorithm chosen at call time.

    ## Key concepts

    - **Key specs** (`key_spec`) describe the key *material* — e.g. `RSA_2048`,
      `ECC_NIST_P256`, `SYMMETRIC_DEFAULT`, `HMAC_256`. This is fixed at creation
      time and determines what the key can do.
    - **Algorithm IDs** are stable *per-operation* identifiers such as
      `RSASSA_PSS_SHA_256` or `RSAES_OAEP_SHA_256`. Following AWS KMS, one key spec
      is compatible with many algorithm IDs; the algorithm is chosen per operation
      at sign/encrypt time, not baked into the key. A single `RSA_2048` key serves
      all six RSASSA signing algorithms and RSA-OAEP encryption.
    - **Operations** / **key usages** declare what a key may be used for at creation
      time. `key_usages` (e.g. `SIGN_VERIFY`) is a coarse convenience expanded into
      the fine-grained `operations` set. Requesting an operation the key spec cannot
      perform is rejected with `400`.
    - **State machine**: `enabled ⇄ disabled → pendingDeletion → destroyed`.
      `DELETE /keys/{id}` triggers a soft-delete (202); the key stays accessible
      until the pending window elapses.
    - **Aliases** are stable names that point to a key UUID. `PUT /aliases/{name}`
      is an upsert — it creates or atomically retargets in one call.
    - **Transparent alias resolution**: `GET /keys/{id}` accepts both a UUID and
      an alias name.
  contact:
    name: Lamassu IoT
    url: https://github.com/lamassuiot/lamassuiot
  license:
    name: Mozilla Public License 2.0
    url: https://github.com/lamassuiot/lamassuiot?tab=MPL-2.0-1-ov-file#readme

servers:
  - url: /v2/kms
    description: KMS API v2

tags:
  - name: Keys
    description: Key lifecycle management
  - name: State
    description: Key state machine transitions
  - name: Backup
    description: Key backup and restore
  - name: Aliases
    description: Stable alias management
  - name: Utility
    description: RNG and other utilities

paths:

  # ---------------------------------------------------------------------------
  # Keys
  # ---------------------------------------------------------------------------

  /keys:
    get:
      tags: [Keys]
      summary: List keys
      operationId: listKeys
      parameters:
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Limit'
        - name: filter
          in: query
          description: Server-side filter expression (e.g. `state[eq]enabled`)
          schema:
            type: string
      responses:
        '200':
          description: Paginated key list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListKeysResponse'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Keys]
      summary: Create or import a key
      description: |
        When `key_material` is absent a new key is generated (`CreateKey`).
        When `key_material` is present (base64-encoded PKCS#8 DER or raw symmetric
        bytes) the material is imported (`ImportKey`).
      operationId: createOrImportKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKeyRequest'
            examples:
              generateECDSA:
                summary: Generate EC P-256 key (signs with ECDSA, agrees with ECDH)
                value:
                  key_spec: ECC_NIST_P256
                  key_usages: [SIGN_VERIFY, KEY_AGREEMENT]
                  policy_id: pol-default
                  tags:
                    device_id: sensor-42
              generateMLKEM:
                summary: Generate ML-KEM-768 (post-quantum)
                value:
                  key_spec: ML_KEM_768
                  key_usages: [ENCAPSULATE_DECAPSULATE]
              importRSA:
                summary: Import existing RSA 2048 key (serves PKCS1v15, PSS and OAEP)
                value:
                  key_spec: RSA_2048
                  key_usages: [SIGN_VERIFY, ENCRYPT_DECRYPT]
                  key_material: MIIEvAIBADANBgkqhkiG9w0BAQEFAASC...
      responses:
        '201':
          description: Key created or imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /keys/{id}:
    parameters:
      - $ref: '#/components/parameters/KeyID'

    get:
      tags: [Keys]
      summary: Get key
      description: |
        Returns the key identified by `id`. Accepts either a UUID or an alias name —
        resolution is transparent.
      operationId: getKey
      responses:
        '200':
          description: Key metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyMetadata'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [Keys]
      summary: Update key metadata
      description: |
        Patches mutable metadata fields (`tags`, `policy_id`, `not_after`).
        Never triggers a state transition — use `PUT /keys/{id}/state` for that.
      operationId: updateKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKeyRequest'
            example:
              tags:
                env: prod
                audited: "true"
              not_after: "2027-01-01T00:00:00Z"
      responses:
        '200':
          description: Updated key metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Keys]
      summary: Schedule key deletion
      description: |
        Soft-deletes the key by transitioning it to `pendingDeletion`. The key
        remains accessible until the pending window elapses.

        Use `?pending_days=N` to override the default 7-day window.
        Use `PUT /keys/{id}/state` with `{"state":"disabled"}` to cancel.
      operationId: deleteKey
      parameters:
        - name: pending_days
          in: query
          description: Days before the key is permanently destroyed (default 7)
          schema:
            type: integer
            default: 7
            minimum: 1
      responses:
        '202':
          description: Deletion scheduled — key is now `pendingDeletion`
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  state:
                    type: string
                    example: pendingDeletion
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------------------
  # State
  # ---------------------------------------------------------------------------

  /keys/{id}/state:
    parameters:
      - $ref: '#/components/parameters/KeyID'

    put:
      tags: [State]
      summary: Set key state
      description: |
        Drives the key state machine. Valid transitions:

        | From             | To               | Notes                                       |
        |------------------|------------------|---------------------------------------------|
        | `enabled`        | `disabled`       | `DisableKey`                                |
        | `disabled`       | `enabled`        | `EnableKey`                                 |
        | `enabled`        | `pendingDeletion` | `ScheduleDeletion` — `deletion_scheduled_at` required |
        | `disabled`       | `pendingDeletion` | `ScheduleDeletion` — `deletion_scheduled_at` required |
        | `pendingDeletion` | `disabled`      | `CancelDeletion`                            |

        Invalid transitions return `409 Conflict`.
      operationId: setKeyState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetKeyStateRequest'
            examples:
              disable:
                summary: Disable key
                value:
                  state: disabled
              enable:
                summary: Re-enable key
                value:
                  state: enabled
              scheduleDeletion:
                summary: Schedule deletion
                value:
                  state: pendingDeletion
                  deletion_scheduled_at: "2026-07-15T00:00:00Z"
              cancelDeletion:
                summary: Cancel pending deletion (back to disabled)
                value:
                  state: disabled
      responses:
        '200':
          description: State transition applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateTransitionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflict — invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------------------
  # Backup
  # ---------------------------------------------------------------------------

  /keys/{id}/backup:
    parameters:
      - $ref: '#/components/parameters/KeyID'

    put:
      tags: [Backup]
      summary: Backup key
      description: |
        Exports an encrypted backup blob for the key. Only available for backends
        with `extractable: true`. Idempotent — repeated calls refresh the blob.
      operationId: backupKey
      responses:
        '200':
          description: Backup blob
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupKeyResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /keys/restore:
    post:
      tags: [Backup]
      summary: Restore key from backup
      description: |
        Imports a key from a previously exported backup blob. The restored key
        receives a new UUID; its metadata and key spec are preserved from the blob.
      operationId: restoreKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreKeyRequest'
      responses:
        '200':
          description: Restored key metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------------------
  # Aliases
  # ---------------------------------------------------------------------------

  /aliases/{name}:
    parameters:
      - $ref: '#/components/parameters/AliasName'

    get:
      tags: [Aliases]
      summary: Resolve alias
      description: Returns the full key metadata for the key the alias points to.
      operationId: resolveAlias
      responses:
        '200':
          description: Key metadata for the aliased key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyMetadata'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Aliases]
      summary: Create or retarget alias
      description: |
        Upserts an alias. If the alias does not exist it is created; if it already
        exists it is atomically retargeted to the new key. Use this for key rotation
        without a delete-then-recreate race window.
      operationId: upsertAlias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertAliasRequest'
            example:
              key_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      responses:
        '200':
          description: Alias created or retargeted
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: ca-root-active
                  key_id:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Target key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Aliases]
      summary: Delete alias
      description: Removes the alias. The key itself is not affected.
      operationId: deleteAlias
      responses:
        '204':
          description: Alias deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------------------
  # Utility
  # ---------------------------------------------------------------------------

  /random:
    post:
      tags: [Utility]
      summary: Generate random bytes
      description: Returns cryptographically strong random bytes from the server's entropy source.
      operationId: generateRandom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRandomRequest'
            example:
              bytes: 32
      responses:
        '200':
          description: Random bytes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateRandomResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

# ---------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------

components:

  parameters:

    KeyID:
      name: id
      in: path
      required: true
      description: Key UUID or alias name
      schema:
        type: string
      example: 3fa85f64-5717-4562-b3fc-2c963f66afa6

    AliasName:
      name: name
      in: path
      required: true
      description: |
        Alias name. Restricted to `[a-zA-Z0-9_-]` characters; maximum 128 characters.
      schema:
        type: string
        pattern: '^[a-zA-Z0-9_-]{1,128}$'
      example: ca-root-active

    PageToken:
      name: page_token
      in: query
      description: Opaque token from a previous response's `next_page_token` field
      schema:
        type: string

    Limit:
      name: limit
      in: query
      description: Maximum number of items to return (default 50)
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 1000

  responses:

    BadRequest:
      description: Bad request — invalid input or operation not supported by the key spec
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Key or alias not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    # -------------------------------------------------------------------------
    # Core domain types
    # -------------------------------------------------------------------------

    KeySpec:
      type: string
      description: |
        Describes the key *material* — fixed at creation time. Determines what a
        key can do and which `AlgorithmID`s it is compatible with. Following AWS
        KMS, the key spec does NOT encode the per-operation scheme or hash.

        | Key spec | Family | Key bits | Supported operations | Notes |
        |----------|--------|----------|----------------------|-------|
        | `RSA_2048` | RSA | 2048 | sign, verify, encrypt, decrypt, wrapKey, unwrapKey | Serves all RSASSA + RSAES algorithms |
        | `RSA_3072` | RSA | 3072 | (same) | |
        | `RSA_4096` | RSA | 4096 | (same) | |
        | `ECC_NIST_P256` | ECDSA | 256 | sign, verify, agreeKey, deriveKey | ECDSA + ECDH from one key |
        | `ECC_NIST_P384` | ECDSA | 384 | (same) | |
        | `ECC_NIST_P521` | ECDSA | 521 | (same) | |
        | `ECC_SECG_P256K1` | ECDSA | 256 | (same) | secp256k1; requires external dep |
        | `ED25519` | EdDSA | 255 | sign, verify | Signs full message |
        | `X25519` | ECDH | 255 | agreeKey, deriveKey | Key agreement only |
        | `SYMMETRIC_DEFAULT` | AES | 256 | encrypt, decrypt | AES-256-GCM |
        | `AES_128` | AES | 128 | encrypt, decrypt | |
        | `AES_192` | AES | 192 | encrypt, decrypt | |
        | `HMAC_256` | HMAC | 256 | mac, verifyMac | |
        | `HMAC_384` | HMAC | 384 | mac, verifyMac | |
        | `HMAC_512` | HMAC | 512 | mac, verifyMac | |
        | `ML_KEM_768` | ML-KEM | — | encapsulate, decapsulate, wrapKey, unwrapKey | 🔒 PQC · FIPS 203 (recommended) |
        | `ML_KEM_1024` | ML-KEM | — | (same) | 🔒 PQC · FIPS 203 · category 5 |
      enum:
        - RSA_2048
        - RSA_3072
        - RSA_4096
        - ECC_NIST_P256
        - ECC_NIST_P384
        - ECC_NIST_P521
        - ECC_SECG_P256K1
        - ED25519
        - X25519
        - SYMMETRIC_DEFAULT
        - AES_128
        - AES_192
        - HMAC_256
        - HMAC_384
        - HMAC_512
        - ML_KEM_768
        - ML_KEM_1024
      example: ECC_NIST_P256

    KeyUsage:
      type: string
      description: |
        Coarse, API-facing grouping of operations, expanded into the fine-grained
        `operations` set at key creation. A key MAY declare multiple usages.
      enum:
        - SIGN_VERIFY
        - ENCRYPT_DECRYPT
        - WRAP_UNWRAP
        - GENERATE_VERIFY_MAC
        - KEY_AGREEMENT
        - ENCAPSULATE_DECAPSULATE
      example: SIGN_VERIFY

    AlgorithmID:
      type: string
      description: |
        Stable *per-operation* algorithm identifier (scheme + hash), chosen at
        sign/encrypt time. A single `KeySpec` is compatible with many algorithm
        IDs; the size comes from the key, not the algorithm.

        **Legend** — operation shorthands:
        `S`=sign  `V`=verify  `E`=encrypt  `D`=decrypt  `W`=wrapKey  `U`=unwrapKey
        `Ec`=encapsulate  `Dc`=decapsulate  `M`=mac  `Vm`=verifyMac
        `A`=agreeKey  `K`=deriveKey

        | ID | Ops | Compatible key specs | Notes |
        |----|-----|----------------------|-------|
        | `RSASSA_PKCS1_V1_5_SHA_256` | S V | RSA_* | PKCS#1 v1.5; use PSS for new code |
        | `RSASSA_PKCS1_V1_5_SHA_384` | S V | RSA_* | |
        | `RSASSA_PKCS1_V1_5_SHA_512` | S V | RSA_* | |
        | `RSASSA_PSS_SHA_256` | S V | RSA_* | Preferred for new signatures |
        | `RSASSA_PSS_SHA_384` | S V | RSA_* | |
        | `RSASSA_PSS_SHA_512` | S V | RSA_* | |
        | `RSAES_OAEP_SHA_1` | E D W U | RSA_* | |
        | `RSAES_OAEP_SHA_256` | E D W U | RSA_* | |
        | `RSAES_OAEP_SHA_384` | E D W U | RSA_* | |
        | `RSAES_OAEP_SHA_512` | E D W U | RSA_* | |
        | `RSAES_PKCS1_V1_5` | D U | RSA_* | ⚠ Legacy decrypt only |
        | `ECDSA_SHA_256` | S V | ECC_NIST_P256, ECC_SECG_P256K1 | |
        | `ECDSA_SHA_384` | S V | ECC_NIST_P384 | |
        | `ECDSA_SHA_512` | S V | ECC_NIST_P521 | |
        | `ED25519` | S V | ED25519 | Signs full message |
        | `SYMMETRIC_DEFAULT` | E D | SYMMETRIC_DEFAULT, AES_128, AES_192 | AES-GCM; 96-bit nonce |
        | `AES_CBC` | D | AES_* | ⚠ Legacy decrypt only; not AEAD |
        | `HMAC_SHA_256` | M Vm | HMAC_256 | RFC 2104 |
        | `HMAC_SHA_384` | M Vm | HMAC_384 | |
        | `HMAC_SHA_512` | M Vm | HMAC_512 | |
        | `ECDH` | A K | ECC_NIST_*, ECC_SECG_P256K1, X25519 | Curve from the key |
        | `ML_KEM_768` | Ec Dc W U | ML_KEM_768 | 🔒 PQC · FIPS 203 |
        | `ML_KEM_1024` | Ec Dc W U | ML_KEM_1024 | 🔒 PQC · FIPS 203 |
      enum:
        - RSASSA_PKCS1_V1_5_SHA_256
        - RSASSA_PKCS1_V1_5_SHA_384
        - RSASSA_PKCS1_V1_5_SHA_512
        - RSASSA_PSS_SHA_256
        - RSASSA_PSS_SHA_384
        - RSASSA_PSS_SHA_512
        - RSAES_OAEP_SHA_1
        - RSAES_OAEP_SHA_256
        - RSAES_OAEP_SHA_384
        - RSAES_OAEP_SHA_512
        - RSAES_PKCS1_V1_5
        - ECDSA_SHA_256
        - ECDSA_SHA_384
        - ECDSA_SHA_512
        - ED25519
        - SYMMETRIC_DEFAULT
        - AES_CBC
        - HMAC_SHA_256
        - HMAC_SHA_384
        - HMAC_SHA_512
        - ECDH
        - ML_KEM_768
        - ML_KEM_1024
      example: RSASSA_PSS_SHA_256

    Family:
      type: string
      description: Key material family grouping — useful for routing to the right backend capability.
      enum:
        - RSA
        - ECDSA
        - EdDSA
        - ECDH
        - ML-KEM
        - AES
        - HMAC
      example: ECDSA

    KeyState:
      type: string
      enum: [enabled, disabled, pendingDeletion, destroyed]
      description: |
        Lifecycle state of the key.

        | State | Description |
        |-------|-------------|
        | `enabled` | Key is active; all permitted operations allowed |
        | `disabled` | Key is suspended; no cryptographic operations permitted |
        | `pendingDeletion` | Scheduled for permanent destruction; still readable for audit |
        | `destroyed` | Key material permanently erased; metadata retained for audit trail |

        Valid transitions:

        ```
        enabled ⇄ disabled
        enabled  → pendingDeletion
        disabled → pendingDeletion
        pendingDeletion → disabled   (cancel)
        pendingDeletion → destroyed  (automatic after window)
        ```

    KeyOrigin:
      type: string
      enum: [generated, imported, external]
      description: |
        How the key material was provisioned.
        - `generated` — key was created by the KMS backend
        - `imported` — key material was provided by the caller via `key_material`
        - `external` — key lives in an external system; only a reference is stored

    Operation:
      type: string
      enum:
        - sign
        - verify
        - encrypt
        - decrypt
        - wrapKey
        - unwrapKey
        - encapsulate
        - decapsulate
        - mac
        - verifyMac
        - agreeKey
        - deriveKey
      description: |
        Cryptographic operation the key is authorised to perform.

        | Operation | Description |
        |-----------|-------------|
        | `sign` | Produce a digital signature over a message digest |
        | `verify` | Verify a digital signature |
        | `encrypt` | Asymmetric or symmetric encryption |
        | `decrypt` | Decryption |
        | `wrapKey` | Encrypt another key's material (key wrapping) |
        | `unwrapKey` | Decrypt wrapped key material |
        | `encapsulate` | KEM encapsulation — generate shared secret + ciphertext |
        | `decapsulate` | KEM decapsulation — recover shared secret from ciphertext |
        | `mac` | Compute a Message Authentication Code |
        | `verifyMac` | Verify a MAC |
        | `agreeKey` | Perform a Diffie-Hellman-style key agreement |
        | `deriveKey` | Derive keying material (HKDF, KDF) |

    KeyMetadata:
      type: object
      description: Complete metadata for a managed key
      properties:
        id:
          type: string
          format: uuid
          description: Stable unique identifier assigned at creation
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        key_spec:
          $ref: '#/components/schemas/KeySpec'
        operations:
          type: array
          items:
            $ref: '#/components/schemas/Operation'
          description: Operations this key is authorised to perform
          example: [sign, verify]
        state:
          $ref: '#/components/schemas/KeyState'
        public_key:
          type: string
          description: |
            Public key in PEM format (PKIX `BEGIN PUBLIC KEY` block) for
            asymmetric algorithms. Base64-encoded raw bytes for post-quantum
            types not yet covered by PKIX. Absent for symmetric keys.
          example: "-----BEGIN PUBLIC KEY-----\nMFkwEwYHKoZIzj0CAQY...\n-----END PUBLIC KEY-----\n"
        created_at:
          type: string
          format: date-time
          example: "2026-06-15T10:00:00Z"
        not_before:
          type: string
          format: date-time
          nullable: true
          example: "2026-06-15T00:00:00Z"
        not_after:
          type: string
          format: date-time
          nullable: true
          example: "2027-06-15T00:00:00Z"
        origin:
          $ref: '#/components/schemas/KeyOrigin'
        tags:
          type: object
          additionalProperties:
            type: string
          description: Arbitrary string key-value pairs for classification
          example:
            device_id: sensor-42
            env: prod
        policy_id:
          type: string
          description: Reference to an access/usage policy
          example: pol-default

    # -------------------------------------------------------------------------
    # Request bodies
    # -------------------------------------------------------------------------

    CreateKeyRequest:
      type: object
      required: [key_spec]
      properties:
        key_spec:
          $ref: '#/components/schemas/KeySpec'
        key_usages:
          type: array
          items:
            $ref: '#/components/schemas/KeyUsage'
          description: |
            Coarse usages, expanded into `operations`. Optional; a key may declare
            several. Ignored operations that the key spec cannot perform are rejected.
          example: [SIGN_VERIFY]
        operations:
          type: array
          items:
            $ref: '#/components/schemas/Operation'
          description: |
            Fine-grained operations to permit, merged with the expansion of
            `key_usages`. Defaults to the key spec's full supported set when both
            are omitted. Must not include operations the key spec cannot perform.
        tags:
          type: object
          additionalProperties:
            type: string
        policy_id:
          type: string
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        backend_hint:
          type: string
          description: Preferred backend name (e.g. `pkcs11-hsm-01`). Server falls back to policy routing when absent.
        key_material:
          type: string
          format: byte
          description: |
            Base64-encoded private key material for the **import** path.
            Asymmetric: PKCS#8 DER. Symmetric / ML-KEM: raw bytes.
            When present the request is treated as ImportKey; when absent a new
            key is generated.

    UpdateKeyRequest:
      type: object
      description: |
        Partial update of mutable metadata. Only fields that are explicitly
        provided are changed. State is never changed via this endpoint.
      properties:
        tags:
          type: object
          additionalProperties:
            type: string
        policy_id:
          type: string
        not_after:
          type: string
          format: date-time

    SetKeyStateRequest:
      type: object
      required: [state]
      properties:
        state:
          $ref: '#/components/schemas/KeyState'
        deletion_scheduled_at:
          type: string
          format: date-time
          description: Required when `state` is `pendingDeletion`. Must be in the future.
          example: "2026-07-15T00:00:00Z"

    RestoreKeyRequest:
      type: object
      required: [backup_blob]
      properties:
        backup_blob:
          type: string
          format: byte
          description: Base64-encoded blob previously returned by `PUT /keys/{id}/backup`

    UpsertAliasRequest:
      type: object
      required: [key_id]
      properties:
        key_id:
          type: string
          format: uuid
          description: UUID of the key this alias should point to
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6

    GenerateRandomRequest:
      type: object
      required: [bytes]
      properties:
        bytes:
          type: integer
          minimum: 1
          maximum: 1024
          description: Number of random bytes to generate
          example: 32

    # -------------------------------------------------------------------------
    # Response bodies
    # -------------------------------------------------------------------------

    ListKeysResponse:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/KeyMetadata'
        next_page_token:
          type: string
          description: Opaque token to pass as `page_token` in the next request. Absent when no further pages exist.

    StateTransitionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/KeyState'
        previous_state:
          $ref: '#/components/schemas/KeyState'
        transitioned_at:
          type: string
          format: date-time
      example:
        id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        state: disabled
        previous_state: enabled
        transitioned_at: "2026-06-15T10:10:00Z"

    BackupKeyResponse:
      type: object
      properties:
        key_id:
          type: string
          format: uuid
        backup_blob:
          type: string
          format: byte
          description: Base64-encoded encrypted backup blob

    GenerateRandomResponse:
      type: object
      properties:
        bytes:
          type: integer
          description: Number of bytes generated
          example: 32
        data:
          type: string
          format: byte
          description: Base64-encoded random bytes
          example: "aGVsbG8gd29ybGQgdGhpcyBpcyBhIHRlc3Q="

    Error:
      type: object
      properties:
        err:
          type: string
          description: Human-readable error message
          example: key not found

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []
