# Authz Service Configuration

# Enable debug logging
debug: true

# JWT verification for OIDC principals. Verification is ON by default and needs
# a JWKS endpoint. For production, set jwks_url and leave the skip flag false.
# jwks_url: https://idp.example.com/.well-known/jwks.json
#
# DEVELOPMENT/TESTING ONLY: parse JWTs without checking the signature, so the
# service can start without an IdP. Never enable this outside local development.
insecure_skip_jwt_verify: true

# Schema name -> path to the JSON schema file
schemas:
  authz: /home/ubuntu/dev/lamassu/lamassuiot/connectors/authz/authz.json
  pki: /home/ubuntu/dev/lamassu/lamassuiot/connectors/authz/pki.json

# http_schemas: list of HTTP schema JSON files (for Envoy ext_authz route mapping)
http_schemas:
  - /home/ubuntu/dev/lamassu/lamassuiot/connectors/authz/examples/wfx/wfx.json

# authz_db: Postgres connection for the authz service's own data
# (principals, grants, policies).  Uses the dedicated "authz" database.
authz_db:
  username: postgres
  password: test
  host: localhost
  port: 5432
  database: authz

# credentials: per-schema Postgres connections used by the authorization engine
# to query entity data for policy evaluation.
credentials:
  authz:
    username: postgres
    password: test
    host: localhost
    port: 5432
    database: authz
  pki:
    username: postgres
    password: test
    host: localhost
    port: 5432
    database: pki
