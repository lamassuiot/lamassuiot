openapi: 3.0.3
info:
  title: Lamassu Authorization Service
  description: |
    Authorization service managing principals, policies, and access control decisions.
    x-trust-boundary records intended callers: internal-gateway for Envoy and
    internal-service for evaluation APIs. Trust boundaries currently equal public
    caller access; no caller authentication or network restriction is enforced by
    this declaration. Enforcement may be added in the future. Handlers still
    evaluate submitted credentials and policies.
  version: 1.0.0
  contact:
    name: Lamassu IoT
    url: https://github.com/lamassuiot/lamassuiot
  license:
    name: Mozilla Public License 2.0
    url: https://github.com/lamassuiot/lamassuiot?tab=MPL-2.0-1-ov-file#readme

servers:
  - url: /api/authz/v1
    description: Authz API v1

security:
  - bearerAuth: []

paths:
  /authz/authorize:
    post:
      x-authz:
        check: evaluation
      x-trust-boundary: internal-service
      security: []
      summary: Authorize a principal against a resource and action
      operationId: Authorize
      tags: [Authorization]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeRequest'
      responses:
        '200':
          description: Authorization decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeResponse'

  /authz/filter:
    post:
      x-authz:
        check: evaluation
      x-trust-boundary: internal-service
      security: []
      summary: Get a filter expression for list operations
      operationId: GetFilter
      tags: [Authorization]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterRequest'
      responses:
        '200':
          description: Filter expression
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterResponse'

  /authz/match/authorize:
    post:
      x-authz:
        check: evaluation
      x-trust-boundary: internal-service
      security: []
      summary: Resolve principal from request context then authorize
      operationId: MatchAndAuthorize
      tags: [Authorization]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchAuthorizeRequest'
      responses:
        '200':
          description: Authorization decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeResponse'

  /authz/match/filter:
    post:
      x-authz:
        check: evaluation
      x-trust-boundary: internal-service
      security: []
      summary: Resolve principal from request context then return a filter expression
      operationId: MatchAndGetFilter
      tags: [Authorization]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchFilterRequest'
      responses:
        '200':
          description: Filter expression
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterResponse'

  /authz/http/check:
    post:
      x-authz:
        check: evaluation
      x-trust-boundary: internal-service
      security: []
      summary: Check HTTP request authorization (ext_authz compatible)
      operationId: CheckHTTP
      tags: [Authorization]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HTTPCheckRequest'
      responses:
        '200':
          description: Authorization decision

  /authz/match/http/check:
    post:
      x-authz:
        check: evaluation
      x-trust-boundary: internal-service
      security: []
      summary: Resolve principal then check HTTP request authorization
      operationId: MatchAndCheckHTTP
      tags: [Authorization]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HTTPCheckRequest'
      responses:
        '200':
          description: Authorization decision

  /authz/capabilities/global:
    post:
      x-authz:
        check: evaluation
      x-trust-boundary: internal-service
      security: []
      summary: Get global capabilities for a principal
      operationId: GetGlobalCapabilities
      tags: [Authorization]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilitiesRequest'
      responses:
        '200':
          description: Global capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'

  /authz/match/capabilities/global:
    post:
      x-authz:
        check: evaluation
      x-trust-boundary: internal-service
      security: []
      summary: Resolve principal then get global capabilities
      operationId: MatchAndGetGlobalCapabilities
      tags: [Authorization]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchCapabilitiesRequest'
      responses:
        '200':
          description: Global capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'

  /authz/capabilities/entity:
    post:
      x-authz:
        check: evaluation
      x-trust-boundary: internal-service
      security: []
      summary: Get capabilities for a principal on a specific entity
      operationId: GetEntityCapabilities
      tags: [Authorization]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityCapabilitiesRequest'
      responses:
        '200':
          description: Entity capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'

  /authz/match/capabilities/entity:
    post:
      x-authz:
        check: evaluation
      x-trust-boundary: internal-service
      security: []
      summary: Resolve principal then get entity capabilities
      operationId: MatchAndGetEntityCapabilities
      tags: [Authorization]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchEntityCapabilitiesRequest'
      responses:
        '200':
          description: Entity capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'

  /principals:
    get:
      x-authz:
        namespace: authz
        schema_name: public
        entity_type: principal
        check: filter
      summary: List principals
      operationId: ListPrincipals
      tags: [Principals]
      responses:
        '200':
          description: List of principals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Principal'
    post:
      x-authz:
        namespace: authz
        schema_name: public
        entity_type: principal
        action: create
      summary: Create a principal
      operationId: CreatePrincipal
      tags: [Principals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Principal'
      responses:
        '201':
          description: Created principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'

  /principals/{id}:
    get:
      x-authz:
        namespace: authz
        schema_name: public
        entity_type: principal
        action: read
      summary: Get a principal by ID
      operationId: GetPrincipal
      tags: [Principals]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'
    put:
      x-authz:
        namespace: authz
        schema_name: public
        entity_type: principal
        action: update
      summary: Update a principal
      operationId: UpdatePrincipal
      tags: [Principals]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Principal'
      responses:
        '200':
          description: Updated principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'
    delete:
      x-authz:
        namespace: authz
        schema_name: public
        entity_type: principal
        action: delete
      summary: Delete a principal
      operationId: DeletePrincipal
      tags: [Principals]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted

  /principals/{id}/policies:
    get:
      x-authz:
        namespace: authz
        schema_name: public
        entity_type: principal_policy
        action: read
      summary: Get policies granted to a principal
      operationId: GetPrincipalPolicies
      tags: [Principals]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of policies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Policy'
    post:
      x-authz:
        namespace: authz
        schema_name: public
        entity_type: principal_policy
        action: grant
      summary: Grant a policy to a principal
      operationId: GrantPolicy
      tags: [Principals]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantPolicyRequest'
      responses:
        '200':
          description: Grant result

  /principals/{id}/policies/{policyId}:
    delete:
      x-authz:
        namespace: authz
        schema_name: public
        entity_type: principal_policy
        action: revoke
      summary: Revoke a policy from a principal
      operationId: RevokePolicy
      tags: [Principals]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: policyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Revoked

  /policies:
    get:
      x-authz:
        namespace: authz
        schema_name: public
        entity_type: policy
        check: filter
      summary: List policies
      operationId: ListPolicies
      tags: [Policies]
      responses:
        '200':
          description: List of policies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Policy'
    post:
      x-authz:
        namespace: authz
        schema_name: public
        entity_type: policy
        action: create
      summary: Create a policy
      operationId: CreatePolicy
      tags: [Policies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Policy'
      responses:
        '201':
          description: Created policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'

  /policies/search:
    get:
      x-authz:
        namespace: authz
        schema_name: public
        entity_type: policy
        check: filter
      summary: Search policies
      operationId: SearchPolicies
      tags: [Policies]
      parameters:
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Matching policies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Policy'

  /policies/{id}:
    get:
      x-authz:
        namespace: authz
        schema_name: public
        entity_type: policy
        action: read
      summary: Get a policy by ID
      operationId: GetPolicy
      tags: [Policies]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
    put:
      x-authz:
        namespace: authz
        schema_name: public
        entity_type: policy
        action: update
      summary: Update a policy
      operationId: UpdatePolicy
      tags: [Policies]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Policy'
      responses:
        '200':
          description: Updated policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
    delete:
      x-authz:
        namespace: authz
        schema_name: public
        entity_type: policy
        action: delete
      summary: Delete a policy
      operationId: DeletePolicy
      tags: [Policies]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted

  /policies/{id}/stats:
    get:
      x-authz:
        namespace: authz
        schema_name: public
        entity_type: policy
        action: read
      summary: Get usage statistics for a policy
      operationId: GetPolicyStats
      tags: [Policies]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Policy statistics

  /schemas:
    get:
      x-authz:
        check: public
      security: []
      summary: List available authorization schemas
      operationId: GetSchemas
      tags: [Schemas]
      responses:
        '200':
          description: Schema definitions

  /ext_authz/check:
    get:
      summary: Evaluate Envoy forwarded credentials and HTTP policies
      x-authz:
        check: envoy
      x-trust-boundary: internal-gateway
      security: []
      responses:
        '200':
          description: Request authorized
        '403':
          description: Request denied or credentials missing
        '500':
          description: Authorization evaluation failed
    post:
      summary: Evaluate Envoy forwarded credentials and HTTP policies
      x-authz:
        check: envoy
      x-trust-boundary: internal-gateway
      security: []
      responses:
        '200':
          description: Request authorized
        '403':
          description: Request denied or credentials missing
        '500':
          description: Authorization evaluation failed
    put:
      summary: Evaluate Envoy forwarded credentials and HTTP policies
      x-authz:
        check: envoy
      x-trust-boundary: internal-gateway
      security: []
      responses:
        '200':
          description: Request authorized
        '403':
          description: Request denied or credentials missing
        '500':
          description: Authorization evaluation failed
    patch:
      summary: Evaluate Envoy forwarded credentials and HTTP policies
      x-authz:
        check: envoy
      x-trust-boundary: internal-gateway
      security: []
      responses:
        '200':
          description: Request authorized
        '403':
          description: Request denied or credentials missing
        '500':
          description: Authorization evaluation failed
    head:
      summary: Evaluate Envoy forwarded credentials and HTTP policies
      x-authz:
        check: envoy
      x-trust-boundary: internal-gateway
      security: []
      responses:
        '200':
          description: Request authorized
        '403':
          description: Request denied or credentials missing
        '500':
          description: Authorization evaluation failed
    options:
      summary: Evaluate Envoy forwarded credentials and HTTP policies
      x-authz:
        check: envoy
      x-trust-boundary: internal-gateway
      security: []
      responses:
        '200':
          description: Request authorized
        '403':
          description: Request denied or credentials missing
        '500':
          description: Authorization evaluation failed
    delete:
      summary: Evaluate Envoy forwarded credentials and HTTP policies
      x-authz:
        check: envoy
      x-trust-boundary: internal-gateway
      security: []
      responses:
        '200':
          description: Request authorized
        '403':
          description: Request denied or credentials missing
        '500':
          description: Authorization evaluation failed
    x-connect:
      summary: Evaluate Envoy forwarded credentials and HTTP policies
      x-authz:
        check: envoy
      x-trust-boundary: internal-gateway
      security: []
      responses:
        '200':
          description: Request authorized
        '403':
          description: Request denied or credentials missing
        '500':
          description: Authorization evaluation failed
    trace:
      summary: Evaluate Envoy forwarded credentials and HTTP policies
      x-authz:
        check: envoy
      x-trust-boundary: internal-gateway
      security: []
      responses:
        '200':
          description: Request authorized
        '403':
          description: Request denied or credentials missing
        '500':
          description: Authorization evaluation failed
  /ext_authz/check/{original_url}:
    parameters:
      - name: original_url
        in: path
        required: true
        schema: {type: string}
        description: Original request path (Gin catch-all; may contain slashes).
    get:
      summary: Evaluate Envoy forwarded credentials and HTTP policies
      x-authz:
        check: envoy
      x-trust-boundary: internal-gateway
      security: []
      responses:
        '200':
          description: Request authorized
        '403':
          description: Request denied or credentials missing
        '500':
          description: Authorization evaluation failed
    post:
      summary: Evaluate Envoy forwarded credentials and HTTP policies
      x-authz:
        check: envoy
      x-trust-boundary: internal-gateway
      security: []
      responses:
        '200':
          description: Request authorized
        '403':
          description: Request denied or credentials missing
        '500':
          description: Authorization evaluation failed
    put:
      summary: Evaluate Envoy forwarded credentials and HTTP policies
      x-authz:
        check: envoy
      x-trust-boundary: internal-gateway
      security: []
      responses:
        '200':
          description: Request authorized
        '403':
          description: Request denied or credentials missing
        '500':
          description: Authorization evaluation failed
    patch:
      summary: Evaluate Envoy forwarded credentials and HTTP policies
      x-authz:
        check: envoy
      x-trust-boundary: internal-gateway
      security: []
      responses:
        '200':
          description: Request authorized
        '403':
          description: Request denied or credentials missing
        '500':
          description: Authorization evaluation failed
    head:
      summary: Evaluate Envoy forwarded credentials and HTTP policies
      x-authz:
        check: envoy
      x-trust-boundary: internal-gateway
      security: []
      responses:
        '200':
          description: Request authorized
        '403':
          description: Request denied or credentials missing
        '500':
          description: Authorization evaluation failed
    options:
      summary: Evaluate Envoy forwarded credentials and HTTP policies
      x-authz:
        check: envoy
      x-trust-boundary: internal-gateway
      security: []
      responses:
        '200':
          description: Request authorized
        '403':
          description: Request denied or credentials missing
        '500':
          description: Authorization evaluation failed
    delete:
      summary: Evaluate Envoy forwarded credentials and HTTP policies
      x-authz:
        check: envoy
      x-trust-boundary: internal-gateway
      security: []
      responses:
        '200':
          description: Request authorized
        '403':
          description: Request denied or credentials missing
        '500':
          description: Authorization evaluation failed
    x-connect:
      summary: Evaluate Envoy forwarded credentials and HTTP policies
      x-authz:
        check: envoy
      x-trust-boundary: internal-gateway
      security: []
      responses:
        '200':
          description: Request authorized
        '403':
          description: Request denied or credentials missing
        '500':
          description: Authorization evaluation failed
    trace:
      summary: Evaluate Envoy forwarded credentials and HTTP policies
      x-authz:
        check: envoy
      x-trust-boundary: internal-gateway
      security: []
      responses:
        '200':
          description: Request authorized
        '403':
          description: Request denied or credentials missing
        '500':
          description: Authorization evaluation failed

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    AuthorizeRequest:
      type: object
      properties:
        principal_id:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        action:
          type: string

    FilterRequest:
      type: object
      properties:
        principal_id:
          type: string
        resource_type:
          type: string
        action:
          type: string

    FilterResponse:
      type: object
      properties:
        filter:
          type: string

    AuthorizeResponse:
      type: object
      properties:
        allowed:
          type: boolean

    MatchAuthorizeRequest:
      type: object
      properties:
        resource_type:
          type: string
        resource_id:
          type: string
        action:
          type: string

    MatchFilterRequest:
      type: object
      properties:
        resource_type:
          type: string
        action:
          type: string

    HTTPCheckRequest:
      type: object
      properties:
        method:
          type: string
        path:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string

    CapabilitiesRequest:
      type: object
      properties:
        principal_id:
          type: string

    MatchCapabilitiesRequest:
      type: object

    EntityCapabilitiesRequest:
      type: object
      properties:
        principal_id:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string

    MatchEntityCapabilitiesRequest:
      type: object
      properties:
        resource_type:
          type: string
        resource_id:
          type: string

    CapabilitiesResponse:
      type: object
      additionalProperties:
        type: array
        items:
          type: string

    Principal:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        auth_config:
          type: object
          additionalProperties: true

    Policy:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        rules:
          type: array
          items:
            type: object
            additionalProperties: true

    GrantPolicyRequest:
      type: object
      properties:
        policy_id:
          type: string
